<script src="https://cdn.tailwindcss.com"></script>
<script>
  // "slate" es el gris de Tailwind mas usado en el modal de ajustes y las
  // alertas de error, y sigue siendo un gris FRIO (con un tinte azulado)
  // aunque el resto de la paleta ya paso a tonos calidos. En vez de
  // reescribir cada clase bg-slate-XXX/text-slate-XXX a mano, se redirige
  // aqui la escala completa hacia los mismos valores que Tailwind usa para
  // "stone" (su gris calido de fabrica), asi toda clase slate-* existente
  // hereda el tono calido sin tocar el HTML.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: {
            50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1',
            400: '#a8a29e', 500: '#78716c', 600: '#57534e', 700: '#44403c',
            800: '#292524', 900: '#1c1917', 950: '#0c0a09',
          },
        },
      },
    },
  };
</script>

<style>
  /* Respaldo por si el CDN de Tailwind sirve v3 y no reconoce nombres de v4 */
  .shadow-xs { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04); }
  .focus\:outline-hidden:focus { outline: none; }

  /* --------------------------------------------------------------------
     Sistema de movimiento: una sola curva de easing para todo, para que
     nada se sienta "de fábrica". cubic-bezier(0.32, 0.72, 0, 1) frena
     fuerte al final -física de algo que llega y se asienta, no un
     ease-out lineal-. Es la misma curva que usan Vaul/Sonner (Emil
     Kowalski). Un solo lugar para tocar el "ritmo" de toda la interfaz.
     -------------------------------------------------------------------- */
  :root {
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  ::selection { background: rgb(31 108 159 / 0.12); color: #1F6C9F; }

  /* Fondo: un gris-azulado muy suave en vez de blanco plano, con una

     sin robarle protagonismo a las tarjetas blancas, que son las que

    background-size: 100% 100%, 100% 100%, 350px 235px;
    background-attachment: fixed, fixed, fixed;
    background-repeat: no-repeat, no-repeat, repeat;
  }

  /* Numeros con ancho fijo por digito: al contar hacia arriba, el resto
     del layout no tiembla ni se reacomoda con cada frame. */
  .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

  /* Toda transicion interactiva usa la misma curva y la misma duracion
     base, salvo que se diga lo contrario explicitamente. */
  button, select, input, a, [data-action] {
    transition: background-color .18s var(--ease), border-color .18s var(--ease),
                color .18s var(--ease), box-shadow .22s var(--ease),
                transform .18s var(--ease), opacity .18s var(--ease);
  }
  button:active, [data-action]:active { transform: scale(0.97); }
  select:disabled, button:disabled { transform: none; }

  /* Tarjetas: la sombra plana original se reemplaza por una que "respira"
     al pasar el mouse -se levanta un pixel, la sombra crece un poco-, en
     vez de solo cambiar el color del borde. */
  .card-lift { transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease); }
  .card-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgb(17 17 17 / 0.08); }

  /* Entrada escalonada de secciones, solo en la primera pintura real de
     datos (no en cada render(): eso se veria como parpadeo). Se activa
     agregando .stagger-in a <main> despues del primer render con datos. */
  .stagger-in > * { opacity: 0; transform: translateY(6px); animation: enter .5s var(--ease) forwards; }
  .stagger-in > *:nth-child(1) { animation-delay: .02s; }
  .stagger-in > *:nth-child(2) { animation-delay: .07s; }
  .stagger-in > *:nth-child(3) { animation-delay: .12s; }
  .stagger-in > *:nth-child(4) { animation-delay: .17s; }
  .stagger-in > *:nth-child(5) { animation-delay: .22s; }
  @keyframes enter { to { opacity: 1; transform: translateY(0); } }

  /* Skeleton con brillo que recorre la tarjeta, no un parpadeo plano:
     comunica "esto ya viene en camino" en vez de "algo esta atascado". */
  .skeleton {
    background: linear-gradient(100deg, #f3f2ef 30%, #f7f6f3 45%, #f3f2ef 60%);
    background-size: 250% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -50% 0; } }

  /* Modal: fondo y contenido animan por separado, con un ligero overshoot
     de resorte en el contenido -se pasa un poco y vuelve-, en vez de un
     zoom-in mecanico. */
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-backdrop { animation: backdropIn .2s var(--ease); }
  .modal-anim { animation: modalIn .35s var(--ease-spring); }

  /* Barra de progreso de las tarjetas KPI: crece con la misma fisica que
     el resto, no con la transicion generica de Tailwind. */
  /* transform en vez de width: no dispara reflow, solo compositing.
     origin-left para que crezca desde la izquierda como antes. */
  .kpi-bar { transition: transform .7s var(--ease); transform-origin: left; will-change: transform; }

  /* Fila de tabla y fila de zona: leve desplazamiento lateral al pasar el
     mouse, como si respondiera al cursor y no solo cambiara de color. */
  .row-hover { transition: background-color .15s var(--ease); }

  /* Reduce motion: quien lo pide en el sistema operativo, lo obtiene. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  /* Ilustracion del espacio reservado para el mapa de calor: un "radar"
     que pulsa sobre un plano de tienda dibujado a mano en SVG. No es un
     grafico con datos -la API todavia no expone coordenadas de calor-, es
     una promesa visual honesta de "esto va a vivir aqui". */
  .pulse-ring { transform-box: fill-box; transform-origin: center; animation: pulseScale 2.4s var(--ease) infinite; }
  .pulse-ring.delay-1 { animation-delay: .8s; }
  .pulse-ring.delay-2 { animation-delay: 1.6s; }
  @keyframes pulseScale { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(7); opacity: 0; } }
  .shelf-glow { animation: shelfGlow 3.6s var(--ease) infinite; }
  .shelf-glow.delay-1 { animation-delay: 1.2s; }
  .shelf-glow.delay-2 { animation-delay: 2.4s; }
  @keyframes shelfGlow { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
</style>

function formatDwellTime(seconds) {
  if (seconds === null || seconds === undefined || isNaN(seconds)) return '—';
  if (seconds < 0) return '0.0s';
  if (seconds < 60) return `${seconds.toFixed(1)}s`;
  const minutes = Math.floor(seconds / 60);
  const remaining = Math.round(seconds % 60);
  return `${minutes}m ${remaining}s`;
}
function formatPercentage(value) {
  if (value === null || value === undefined || isNaN(value)) return '—';
  return `${(value * 100).toFixed(1)}%`;
}
function formatNumber(value) {
  if (value === null || value === undefined || isNaN(value)) return '—';
  return new Intl.NumberFormat('es-ES').format(value);
}
function calculateRejectionRate(putBack, pickUp) {
  if (putBack === null || putBack === undefined || pickUp === null || pickUp === undefined) {
    return { rate: null, label: '—', explanation: 'Sin datos suficientes' };
  }
  if (pickUp === 0) return { rate: null, label: '—', explanation: 'Sin tomas registradas' };
  const rate = putBack / pickUp;
  return { rate, label: `${(rate * 100).toFixed(1)}%`, explanation: `${putBack} de ${pickUp} tomas devueltas` };
}
function isDemoVideo(videoId) {
  return videoId.toLowerCase().startsWith('video_demo_');
}
function formatDuration(durationSeconds) {
  if (!durationSeconds || isNaN(durationSeconds)) return '—';
  const mins = Math.floor(durationSeconds / 60);
  const secs = Math.floor(durationSeconds % 60);
  return mins === 0 ? `${secs}s` : `${mins}m ${secs}s`;
}
function formatDateTime(isoString) {
  if (!isoString) return '—';
  try {
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString;
    return new Intl.DateTimeFormat('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
  } catch { return isoString; }
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// --------------------------------------------------------------------------
// Cliente API REST (espejo de src/services/api.ts del original)
// --------------------------------------------------------------------------
function cleanBaseUrl(url) { return url.trim().replace(/\/+$/, ''); }

async function fetchFromApi(url) {
  const response = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });
  if (!response.ok) {
    let errorDetail = `Error en la solicitud (${response.status} ${response.statusText})`;
    try {
      const errorJson = await response.json();
      if (errorJson && typeof errorJson.detail === 'string') errorDetail = errorJson.detail;
    } catch {}
    const err = new Error(errorDetail);
    err.status = response.status;
    throw err;
  }
  return response.json();
}
async function checkBackendHealth(baseUrl) {
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/health`);
}
async function getVideos(baseUrl, useMock) {
  if (useMock) return MOCK_VIDEOS;
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos`);
}
async function getVideoDetail(baseUrl, videoId, useMock) {
  if (useMock) {
    const mock = MOCK_DETAILS[videoId];
    if (mock) return mock;
    const err = new Error(`El video '${videoId}' no existe en el registro del sistema de vision.`);
    err.status = 404;
    throw err;
  }
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos/${encodeURIComponent(videoId)}`);
}
async function getVideoMetrics(baseUrl, videoId, useMock) {
  if (useMock) return MOCK_METRICS[videoId] || [];
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos/${encodeURIComponent(videoId)}/metrics`);
}

function setState(patch) { Object.assign(state, patch); render(); }

// --------------------------------------------------------------------------
// Carga de datos
// --------------------------------------------------------------------------
async function verifyHealth() {
  setState({ isCheckingHealth: true });
  try {
    const res = await checkBackendHealth(state.apiBaseUrl);
    setState({ isBackendHealthy: res.status === 'ok', isCheckingHealth: false });
  } catch {
    setState({ isBackendHealthy: false, isCheckingHealth: false });
  }
}

async function loadVideos() {
  setState({ isLoadingVideos: true, errorVideos: null });
  try {
    const data = await getVideos(state.apiBaseUrl, state.useMockMode);
    const exists = data.some((v) => v.video_id === state.selectedVideoId);
    setState({
      videos: data,
      isLoadingVideos: false,
      selectedVideoId: data.length ? (exists ? state.selectedVideoId : data[0].video_id) : '',
      videoDetail: data.length ? state.videoDetail : null,
      zoneMetrics: data.length ? state.zoneMetrics : [],
    });
    if (state.selectedVideoId) {
      loadVideoDetail(state.selectedVideoId);
      loadVideoMetrics(state.selectedVideoId);
    }
  } catch (err) {
    setState({ errorVideos: err.message || 'Error de red al conectar con GET /videos', isLoadingVideos: false });
  }
}

async function loadVideoDetail(videoId) {
  if (!videoId) return;
  setState({ isLoadingDetail: true, errorDetail: null });
  try {
    const detail = await getVideoDetail(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ videoDetail: detail, isLoadingDetail: false });
  } catch (err) {
    setState({ errorDetail: err.message || `Error al consultar detalles de ${videoId}`, videoDetail: null, isLoadingDetail: false });
  }
}

async function loadVideoMetrics(videoId) {
  if (!videoId) return;
  setState({ isLoadingMetrics: true, errorMetrics: null });
  try {
    const metrics = await getVideoMetrics(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ zoneMetrics: metrics, isLoadingMetrics: false });
  } catch (err) {
    setState({ errorMetrics: err.message || `Error al consultar metricas de zonas para ${videoId}`, zoneMetrics: [], isLoadingMetrics: false });
  }
}

function selectVideo(videoId) {
  setState({ selectedVideoId: videoId });
  loadVideoDetail(videoId);
  loadVideoMetrics(videoId);
}

function toggleMockMode(enabled) {
  localStorage.setItem('gondola_use_mock_mode', String(enabled));
  setState({ useMockMode: enabled });
  loadVideos();
}

// --------------------------------------------------------------------------
// Iconos: Phosphor (peso Bold), via su fuente web por CDN. A diferencia de
// Lucide, es CSS puro (webfont + clase): no hace falta llamar a ninguna
// funcion de "pintado" cada vez que se regenera el DOM, el navegador lo
// resuelve solo. `nombresLucideAPhosphor` traduce los nombres que ya
// estaban en el codigo (portados de la version React con lucide-react) para
// no tener que tocar cada llamada a icon() una por una.
// --------------------------------------------------------------------------
const NOMBRES_LUCIDE_A_PHOSPHOR = {
  'shield-check': 'shield-check', 'sliders': 'faders', 'refresh-cw': 'arrow-clockwise',
  'database': 'database', 'alert-triangle': 'warning', 'help-circle': 'question',
  'clock': 'clock', 'calendar': 'calendar-blank', 'sparkles': 'sparkle',
  'alert-circle': 'warning-circle', 'layers': 'stack', 'tag': 'tag', 'table': 'table',
  'layout-grid': 'squares-four', 'check-circle-2': 'check-circle', 'lightbulb': 'lightbulb',
  'arrow-right': 'arrow-right', 'trending-up': 'trend-up', 'check': 'check', 'x': 'x',
  'server': 'hard-drives', 'map': 'map-pin',
};

// Phosphor escala por font-size, no por width/height: las clases w-X que ya
// traia cada llamada (pensadas para SVGs de Lucide) se traducen aqui a un
// tamano de fuente equivalente, para no tener que reescribir las ~50
// llamadas a icon() que ya existen en el archivo.
const TAMANO_ICONO_PX = { 'w-3.5': 14, 'w-3': 12, 'w-4': 16, 'w-6': 24, 'w-7': 28, 'w-8': 32 };

function icon(name, cls) {
  cls = cls || '';
  const phosphorName = NOMBRES_LUCIDE_A_PHOSPHOR[name] || name;
  let px = 16;
  for (const clase in TAMANO_ICONO_PX) {
    if (cls.includes(clase)) { px = TAMANO_ICONO_PX[clase]; break; }
  }
  return `<i class="ph-bold ph-${phosphorName} ${cls}" style="font-size:${px}px;line-height:1;display:inline-block"></i>`;
}

// --------------------------------------------------------------------------
// Render: banners de estado de conexion / modo demo
// --------------------------------------------------------------------------
function renderConnectionBanner() {
  if (!state.useMockMode && state.isBackendHealthy === false) {
    return `
    <div class="bg-[#FBF3DB] text-[#956400] px-4 py-2 text-xs border-b border-[#EDD9A3]">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          ${icon('alert-triangle', 'w-4 h-4 text-[#7A5200] shrink-0')}
          <span>No se detecta respuesta en <strong class="font-mono">${esc(state.apiBaseUrl)}</strong> (GET /health).</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" data-action="enable-mock" class="underline font-bold hover:text-[#5C3F00]">Activar datos de demostración del contrato</button>
          <span>·</span>
          <button type="button" data-action="retry-health" class="hover:underline flex items-center gap-1">${icon('refresh-cw', 'w-3 h-3')} Reintentar</button>
        </div>
      </div>
    </div>`;
  }
  if (state.useMockMode) {
    return `
    <div class="bg-[#F3F2EF] border-b border-[#EAEAEA] px-4 py-1.5 text-xs text-[#57534E]">
      <div class="max-w-7xl mx-auto flex items-center gap-2">
        ${icon('database', 'w-3.5 h-3.5 text-[#1F6C9F] shrink-0')}
        <span><strong class="text-[#111111]">Modo Demostración Activo:</strong> Respuestas mock que reflejan al 100% el contrato de la API FastAPI.</span>
      </div>
    </div>`;
  }
  return '';
}

// --------------------------------------------------------------------------
// Render: selector de video
// --------------------------------------------------------------------------
function renderVideoSelector() {
  const current = state.videos.find((v) => v.video_id === state.selectedVideoId);
  const isDemo = current ? isDemoVideo(current.video_id) : false;

  const options = state.videos.map((v) => {
    const demo = isDemoVideo(v.video_id);
    return `<option value="${esc(v.video_id)}" ${v.video_id === state.selectedVideoId ? 'selected' : ''}>${esc(v.source_name)} ${demo ? '(PRUEBA)' : '(Real)'}</option>`;
  }).join('');

  const badge = !current ? '' : isDemo
    ? `<span class="px-2.5 py-1 bg-[#FBF3DB] text-[#956400] text-[10px] font-bold rounded flex items-center gap-1 tracking-wider"
             title="Este video corresponde a un conjunto de prueba/simulación. No refleja una grabación real de tienda.">
        ${icon('alert-circle', 'w-3 h-3 text-[#7A5200] shrink-0')} DATOS DE PRUEBA ACTIVOS
       </span>`
    : `<span class="px-2.5 py-1 bg-[#EDF3EC] text-[#346538] border border-[#C7D6C5] text-[10px] font-bold rounded flex items-center gap-1 tracking-wider"
             title="Video capturado y procesado por el pipeline de visión de la tienda.">
        ${icon('sparkles', 'w-3 h-3 text-[#346538] shrink-0')} PRODUCCIÓN REAL
       </span>`;

  const meta = !current ? '' : `
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 pt-2 lg:pt-0 border-t lg:border-t-0 border-[#F3F2EF] text-[11px] text-[#787774]">
      <div class="flex items-center gap-1" title="Duración del fragmento de video analizado">
        ${icon('clock', 'w-3 h-3 text-[#A8A29E]')}
        <span>Duración: <strong class="text-[#111111] font-semibold">${formatDuration(current.duration_s)}</strong></span>
      </div>
      <span class="w-1 h-1 rounded-full bg-[#D6D3D1] hidden sm:inline-block"></span>
      <div class="flex items-center gap-1" title="Resolución y tasa de cuadros por segundo">
        <span>${current.width}×${current.height} (${current.fps} fps)</span>
      </div>
      <span class="w-1 h-1 rounded-full bg-[#D6D3D1] hidden sm:inline-block"></span>
      <div class="flex items-center gap-1" title="Fecha y hora de procesamiento por el pipeline">
        ${icon('calendar', 'w-3 h-3 text-[#A8A29E]')}
        <span>${formatDateTime(current.processed_at)}</span>
      </div>
    </div>`;

  const errorBox = !state.errorVideos ? '' : `
    <div class="mt-2.5 p-2 rounded-md bg-red-50 border border-red-200 text-xs text-red-800 flex items-start gap-2">
      ${icon('alert-circle', 'w-3.5 h-3.5 text-red-600 shrink-0 mt-0.5')}
      <div><span class="font-semibold">Aviso al cargar videos: </span><span>${esc(state.errorVideos)}</span></div>
    </div>`;

  return `
  <div class="bg-white rounded-xl border border-[#EAEAEA] p-3.5 sm:p-4 shadow-xs">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
      <div class="flex-1 flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-[#F3F2EF] rounded-md border border-[#EAEAEA] flex-1 sm:flex-initial min-w-[280px]">
          <span class="text-xs font-medium text-[#57534E] uppercase tracking-wider shrink-0">Video:</span>
          <select id="video-select" data-action="select-video" ${state.isLoadingVideos || !state.videos.length ? 'disabled' : ''}
                  class="bg-transparent text-sm font-semibold text-[#2F3437] outline-none cursor-pointer w-full py-0.5">
            ${options}
          </select>
        </div>
        <div class="flex items-center">${badge}</div>
        <button type="button" data-action="refresh-videos" ${state.isLoadingVideos ? 'disabled' : ''}
                class="inline-flex items-center gap-1 text-xs font-medium text-[#1F6C9F] hover:text-[#18567D] disabled:opacity-50 transition-colors ml-auto sm:ml-0"
                title="Volver a consultar lista de videos en /videos">
          ${icon('refresh-cw', `w-3 h-3 ${state.isLoadingVideos ? 'animate-spin' : ''}`)}
          <span class="text-[11px]">Actualizar</span>
        </button>
      </div>
      ${meta}
    </div>
    ${errorBox}
  </div>`;
}

// --------------------------------------------------------------------------
// Render: tarjetas KPI de resumen
// --------------------------------------------------------------------------
function metricCard({ id, title, value, subtext, badge, tone = 'neutral', tooltip, highlight = false, barColor = '#1F6C9F', progressPercent = 50, countTarget = null }) {
  const toneClasses = { accent: 'text-[#346538]', warning: 'text-[#956400]', danger: 'text-[#9F2F2D]', info: 'text-[#1F6C9F]', neutral: 'text-[#787774]' };
  const clamped = Math.min(100, Math.max(0, progressPercent));
  // Las cuatro tarjetas de conteo entero "cuentan" al aparecer (ver
  // fillCountUps()); las que muestran un porcentaje o un tiempo formateado
  // se pintan directo, contar sus decimales no se ve mejor, se ve nervioso.
  const valueHtml = countTarget !== null
    ? `<span class="text-2xl sm:text-3xl font-bold tracking-tight text-[#111111] tabular-nums" data-count-target="${countTarget}">0</span>`
    : `<span class="text-2xl sm:text-3xl font-bold tracking-tight text-[#111111] tabular-nums">${value}</span>`;
  return `
  <div id="${id}" class="p-4 rounded-xl border card-lift flex flex-col justify-between shadow-xs ${highlight ? 'bg-white border-[#1F6C9F]/40 ring-1 ring-[#1F6C9F]/20' : 'bg-white border-[#EAEAEA]'}">
    <div class="flex items-center justify-between gap-1 mb-1">
      <span class="text-[10px] font-bold text-[#787774] uppercase tracking-[0.1em] truncate" title="${esc(title)}">${esc(title)}</span>

    </div>
    <div class="my-1">
      <div class="flex items-baseline gap-2">
        ${valueHtml}
        ${badge ? `<span class="text-xs font-medium truncate ${toneClasses[tone]}">${esc(badge)}</span>` : ''}
      </div>
      <p class="text-[11px] text-[#787774] truncate mt-0.5" title="${esc(subtext)}">${esc(subtext)}</p>

    </div>

}

function renderSummaryCards() {
  if (state.isLoadingDetail || !state.videoDetail) {
    if (!state.isLoadingDetail) return '';
    const skeletons = Array.from({ length: 6 }).map(() => `
      <div class="h-28 bg-white p-4 rounded-xl border border-[#EAEAEA] flex flex-col justify-between shadow-xs overflow-hidden">
        <div class="h-3 skeleton rounded w-20"></div>
        <div class="h-7 skeleton rounded w-16"></div>
        <div class="w-full bg-[#F3F2EF] h-1 rounded-full"></div>
      </div>`).join('');
    return `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">${skeletons}</div>`;
  }

  const d = state.videoDetail;
  const rejection = calculateRejectionRate(d.put_back_count, d.pick_up_count);
  const interactionRateVal = d.people_count > 0 ? Math.min(100, Math.round((d.interaction_count / d.people_count) * 100)) : 0;
  const pickUpProgress = d.interaction_count > 0 ? Math.min(100, Math.round((d.pick_up_count / d.interaction_count) * 100)) : (d.pick_up_count > 0 ? 50 : 0);
  const putBackProgress = d.pick_up_count > 0 ? Math.min(100, Math.round((d.put_back_count / d.pick_up_count) * 100)) : 0;
  const dwellProgress = Math.min(100, Math.round(((d.average_dwell_time_s || 0) / 20) * 100));

  return `
  <section aria-labelledby="kpi-summary-heading" class="space-y-2">
    <div class="flex items-center justify-between px-1">
      <h2 id="kpi-summary-heading" class="text-[10px] font-bold text-[#787774] uppercase tracking-[0.1em]">Resumen General del Video</h2>
      <span class="text-[11px] text-[#787774]">Grabación: <code class="font-mono text-[#111111]">${esc(d.video_id)}</code></span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
      ${metricCard({ id: 'metric-people-count', title: 'Tráfico Total', value: formatNumber(d.people_count), countTarget: d.people_count, subtext: 'personas detectadas', badge: '100% Anónimo', tone: 'neutral', barColor: '#1F6C9F', progressPercent: d.people_count > 0 ? 65 : 0, tooltip: 'Conteo de identificadores de seguimiento únicos (track_id temporales) detectados en el área del pasillo.' })}
      ${metricCard({ id: 'metric-interaction-count', title: 'Interacciones', value: formatNumber(d.interaction_count), countTarget: d.interaction_count, subtext: `${interactionRateVal}% rate`, badge: `${d.people_count > 0 ? (d.interaction_count / d.people_count).toFixed(1) : '0'} / pers`, tone: 'info', barColor: '#1F6C9F', progressPercent: interactionRateVal, tooltip: 'Eventos donde un cliente se detuvo dentro de la zona de atención de la góndola.' })}
      ${metricCard({ id: 'metric-pick-up-count', title: 'Pick-ups', value: formatNumber(d.pick_up_count), countTarget: d.pick_up_count, subtext: 'productos tomados', badge: 'Extracción', tone: 'accent', barColor: '#1F6C9F', progressPercent: pickUpProgress, tooltip: 'Veces que la mano de un cliente tomó un producto de la góndola según el modelo de interacción.' })}
      ${metricCard({ id: 'metric-put-back-count', title: 'Put-backs', value: formatNumber(d.put_back_count), countTarget: d.put_back_count, subtext: 'devoluciones', badge: d.put_back_count === 0 ? '0 devueltos' : `${d.put_back_count} reposiciones`, tone: d.put_back_count === 0 ? 'accent' : 'danger', barColor: '#9F2F2D', progressPercent: putBackProgress, tooltip: 'Veces que un producto previamente levantado fue colocado nuevamente en la góndola.' })}
      ${metricCard({ id: 'metric-rejection-rate', title: 'Tasa Rechazo', value: rejection.label, subtext: rejection.rate === null ? 'sin tomas' : 'devolución', badge: rejection.rate === null ? 'N/A' : (rejection.rate > 0.3 ? 'Atención' : 'Óptimo'), tone: rejection.rate === null ? 'neutral' : (rejection.rate > 0.3 ? 'danger' : 'accent'), barColor: rejection.rate && rejection.rate > 0.3 ? '#9F2F2D' : '#346538', progressPercent: rejection.rate ? Math.round(rejection.rate * 100) : 0, tooltip: 'Relación de productos devueltos frente al total de productos tomados. Un valor alto sugiere problemas de precio, empaque o fecha de caducidad.' })}
      ${metricCard({ id: 'metric-dwell-time', title: 'Permanencia Media', value: formatDwellTime(d.average_dwell_time_s), subtext: 'avg dwell', badge: 'Atención', tone: 'warning', highlight: true, barColor: '#956400', progressPercent: dwellProgress, tooltip: 'Tiempo promedio en segundos que las personas permanecieron frente al expositor durante su visita.' })}
    </div>
  </section>`;
}

            <div class="p-2 rounded-lg border border-[#F3F2EF] bg-[#F9F9F8]"><div class="text-[10px] text-[#787774] uppercase tracking-wider font-semibold">Toma / Int</div><div class="text-sm font-bold text-[#111111]">${formatPercentage(z.pick_up_rate)}</div></div>

// --------------------------------------------------------------------------
// Render: recomendaciones de space management (derivadas de los datos reales)
// --------------------------------------------------------------------------
function renderInsights() {
  if (!state.videoDetail) return '';
  const d = state.videoDetail;
  const zones = state.zoneMetrics;
  const engagementRatio = d.people_count > 0 ? d.interaction_count / d.people_count : 0;
  const hasPickUps = d.pick_up_count > 0;
  const rejectionRatio = hasPickUps ? d.put_back_count / d.pick_up_count : 0;
  const dwell = d.average_dwell_time_s || 0;

  const list = [];
  if (d.people_count === 0) {
    list.push({ type: 'neutral', title: 'Sin tránsito en el pasillo', desc: 'No se detectaron personas durante este periodo de grabación.', action: 'Evaluar iluminación de cabecera o señalética direccional de pasillo.' });
  } else if (engagementRatio >= 0.8) {
    list.push({ type: 'success', title: 'Alta atracción de clientes al expositor', desc: `Un promedio de ${engagementRatio.toFixed(1)} interacciones por transeúnte con permanencia media de ${formatDwellTime(dwell)}.`, action: 'Mantener la posición de categoría; los clientes se detienen con naturalidad frente a este espacio.' });
  } else if (engagementRatio < 0.4) {
    list.push({ type: 'attention', title: 'Tráfico de paso rápido (Baja detención)', desc: 'La mayoría de personas circulan frente a la góndola sin detenerse ni interactuar.', action: 'Considerar productos gancho o cartelería promocional a la altura de los ojos (1.40m - 1.60m) para frenar el paso.' });
  }
  if (hasPickUps) {
    if (rejectionRatio > 0.4) {
      list.push({ type: 'attention', title: `Fricción de compra: ${Math.round(rejectionRatio * 100)}% de tomas devueltas`, desc: `De ${d.pick_up_count} tomas registradas, ${d.put_back_count} fueron devueltas a la góndola sin compra.`, action: 'Verificar claridad de etiquetas de precio, empaques dañados o información nutricional confusa en los estantes.' });
    } else if (d.put_back_count === 0) {
      list.push({ type: 'success', title: 'Decisión directa: 0% devoluciones', desc: `Todas las ${d.pick_up_count} tomas de producto se mantuvieron en poder del cliente.`, action: 'Planograma óptimo: la presentación del producto genera convicción inmediata en el comprador.' });
    }
  } else if (d.interaction_count > 5 && d.pick_up_count === 0) {
    list.push({ type: 'attention', title: 'Interacción visual sin contacto físico', desc: 'Los clientes se detienen frente a la góndola pero no toman ningún artículo con las manos.', action: 'Revisar accesibilidad física del estante y visibilidad frontal del surtido.' });
  }
  if (zones.length > 1) {
    const bestZone = [...zones].sort((a, b) => (b.conversion_rate || 0) - (a.conversion_rate || 0))[0];
    if (bestZone && (bestZone.conversion_rate || 0) > 0) {
      list.push({ type: 'success', title: `Zona líder en conversión: ${bestZone.name}`, desc: `Registró la mayor tasa de conversión (${formatPercentage(bestZone.conversion_rate)}) entre los estantes analizados.`, action: `Aprovechar el nivel '${bestZone.level}' para productos de mayor margen comercial o lanzamientos.` });
    }
  }

  const cards = list.map((rec) => {
    const isSuccess = rec.type === 'success';
    const isAttention = rec.type === 'attention';
    const cls = isSuccess ? 'bg-[#EDF3EC]/60 border-[#C7D6C5] text-[#346538]' : isAttention ? 'bg-[#FBF3DB]/40 border-[#EDD9A3] text-[#956400]' : 'bg-[#F7F6F3] border-[#EAEAEA] text-[#2F3437]';

function renderSidebar() {

      rejectionDesc = d.put_back_count === 0

        <div class="flex justify-between text-xs font-mono text-[#787774]"><span>STATUS:</span><span class="${state.isBackendHealthy ? 'text-[#346538] font-semibold' : 'text-[#1F6C9F] font-semibold'}">${state.isBackendHealthy ? '200 OK' : 'DEMO MODE'}</span></div>

    <div class="flex items-start gap-3">
      <div class="p-2 rounded-lg bg-red-50 text-red-600 shrink-0">${icon('alert-circle', 'w-6 h-6')}</div>
      <div class="flex-1">
        <h3 class="text-base font-bold text-slate-900">${esc(title)}</h3>
        <div class="mt-1 p-3 rounded-lg bg-red-50/70 border border-red-100 font-mono text-xs text-red-900 leading-relaxed">${esc(detail)}</div>
        <p class="text-xs text-slate-500 mt-2">El backend FastAPI no devolvió los datos esperados o la conexión no pudo establecerse.</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
      <button type="button" data-action="${retryAction}" ${isRetrying ? 'disabled' : ''} class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-xs disabled:opacity-50 transition-colors">
        ${icon('refresh-cw', `w-3.5 h-3.5 ${isRetrying ? 'animate-spin' : ''}`)} Reintentar petición
      </button>
      ${showMock ? `<button type="button" data-action="enable-mock" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold transition-colors">${icon('database', 'w-3.5 h-3.5')} Explorar con Datos de Demostración del Contrato</button>` : ''}
      <button type="button" data-action="open-settings" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition-colors">${icon('sliders', 'w-3.5 h-3.5')} Configurar URL del Backend</button>
    </div>
  </div>`;
}

// --------------------------------------------------------------------------
// Orquestacion del render
// --------------------------------------------------------------------------
// La entrada escalonada (.stagger-in) solo debe verse UNA vez, cuando el
// dashboard "llega" con sus primeros datos reales -no cada vez que se abre
// un modal o se cambia de vista, que se veria como parpadeo. `lastCountedVideoId`
// hace lo mismo para el conteo de numeros: solo cuenta hacia arriba cuando
// el video realmente cambio, no en cada render() sin relacion.
let hasAnimatedIn = false;
let lastCountedVideoId = null;

function render() {
  const root = document.getElementById('root');
  const errorBlocks = [
    state.errorVideos ? errorAlert({ title: 'Error al consultar lista de videos (/videos)', detail: state.errorVideos, retryAction: 'refresh-videos', isRetrying: state.isLoadingVideos }) : '',
    state.errorDetail ? errorAlert({ title: `Error al consultar video ${esc(state.selectedVideoId)} (/videos/${esc(state.selectedVideoId)})`, detail: state.errorDetail, retryAction: 'retry-detail', isRetrying: state.isLoadingDetail }) : '',
  ].join('');

  const firstPaint = !hasAnimatedIn && !!state.videoDetail;

  root.innerHTML = `
    ${renderHeader()}
    ${renderConnectionBanner()}
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 space-y-4 ${firstPaint ? 'stagger-in' : ''}">
      ${renderVideoSelector()}
      ${errorBlocks}
      ${renderSummaryCards()}
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
        <div class="lg:col-span-8 space-y-4">
          ${renderZonesSection()}
          ${renderHeatmapPlaceholder()}
          ${renderInsights()}
        </div>
        <div class="lg:col-span-4 space-y-4">
          ${renderSidebar()}
        </div>
      </div>
    </main>
    <footer class="bg-white border-t border-[#EAEAEA] py-3.5 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center text-xs text-[#787774]">
        <p>Góndola Inteligente · Consola de analítica de video para space management y planogramas.</p>
      </div>
    </footer>
    ${renderConfigModal()}
  `;

  // Phosphor (webfont + clase CSS) no necesita "repintar" iconos tras
  // regenerar el DOM, a diferencia de Lucide: el navegador los resuelve solo.
  if (firstPaint) hasAnimatedIn = true;
  fillCountUps();
}

// --------------------------------------------------------------------------
// Conteo animado de las tarjetas KPI enteras (data-count-target). Curva
// easeOutExpo: arranca rapido y se asienta, coherente con --ease del CSS.
// --------------------------------------------------------------------------
function fillCountUps() {
  const isNewVideo = state.videoDetail && state.videoDetail.video_id !== lastCountedVideoId;
  document.querySelectorAll('[data-count-target]').forEach((el) => {
    const target = Number(el.dataset.countTarget);
    if (isNewVideo) animateCount(el, target, 650);
    else el.textContent = formatNumber(target);
  });
  if (state.videoDetail) lastCountedVideoId = state.videoDetail.video_id;
}

function animateCount(el, to, duration) {
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = t <= 0 ? 0 : 1 - Math.pow(2, -10 * t);
    el.textContent = formatNumber(Math.round(to * eased));
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = formatNumber(to);
  }
  requestAnimationFrame(tick);
}

// --------------------------------------------------------------------------
// Delegacion de eventos: un solo listener para toda la app
// --------------------------------------------------------------------------
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'open-settings') setState({ isConfigModalOpen: true, configTest: null });
  else if (action === 'close-settings') setState({ isConfigModalOpen: false, configTest: null });
  else if (action === 'refresh-videos') loadVideos();
  else if (action === 'retry-detail') loadVideoDetail(state.selectedVideoId);
  else if (action === 'retry-health') verifyHealth();
  else if (action === 'enable-mock') toggleMockMode(true);
  else if (action === 'toggle-mock-in-modal') toggleMockMode(!state.useMockMode);
  else if (action === 'zones-view-table') setState({ zonesViewMode: 'table' });
  else if (action === 'zones-view-cards') setState({ zonesViewMode: 'cards' });
  else if (action === 'reset-default-url') { document.getElementById('api-base-url-input').value = DEFAULT_API_BASE_URL; }
  else if (action === 'test-connection') {
    const url = document.getElementById('api-base-url-input').value;
    setState({ configTesting: true, configTest: null });
    try {
      const res = await checkBackendHealth(url);
      setState({ configTesting: false, configTest: { success: true, message: `Conexión exitosa: GET /health respondió status "${res.status}"` } });
    } catch (err) {
      setState({ configTesting: false, configTest: { success: false, message: `No se pudo conectar: ${err.message}. Asegúrate de que el backend FastAPI esté corriendo en ${url}.` } });
    }
  }
  else if (action === 'save-settings') {
    const url = document.getElementById('api-base-url-input').value.trim();
    localStorage.setItem('gondola_api_base_url', url);
    state.apiBaseUrl = url;
    state.isConfigModalOpen = false;
    state.configTest = null;
    render();
    verifyHealth();
    loadVideos();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'video-select') selectVideo(e.target.value);
});

// --------------------------------------------------------------------------
// Arranque
// --------------------------------------------------------------------------
render();
verifyHealth();
loadVideos();
</script>
