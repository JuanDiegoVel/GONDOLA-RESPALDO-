<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Góndola Inteligente</title>
<meta name="description" content="Dashboard de analítica de comportamiento y space management en góndolas de supermercado." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: {
            50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1',
            400: '#a8a29e', 500: '#78716c', 600: '#57534e', 700: '#44403c',
            800: '#292524', 900: '#1c1917', 950: '#0c0a09',
          },
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
<style>
  .shadow-xs { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04); }
  .focus\:outline-hidden:focus { outline: none; }
  :root {
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  ::selection { background: rgb(31 108 159 / 0.12); color: #1F6C9F; }
  .app-bg {
    background-color: #F7F6F3;
    background-image:
      radial-gradient(ellipse 70% 45% at 15% -8%, rgb(31 108 159 / 0.05), transparent 60%),
      radial-gradient(ellipse 60% 45% at 100% 100%, rgb(31 108 159 / 0.04), transparent 60%);
  }
  .tabular-nums { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  button, select, input, a, [data-action] {
    transition: background-color .18s var(--ease), border-color .18s var(--ease),
                color .18s var(--ease), box-shadow .22s var(--ease),
                transform .18s var(--ease), opacity .18s var(--ease);
  }
  button:active, [data-action]:active { transform: scale(0.97); }
  select:disabled, button:disabled { transform: none; }
  .card-lift { transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease); }
  .card-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgb(17 17 17 / 0.08); }
  .stagger-in > * { opacity: 0; transform: translateY(6px); animation: enter .5s var(--ease) forwards; }
  .stagger-in > *:nth-child(1) { animation-delay: .02s; }
  .stagger-in > *:nth-child(2) { animation-delay: .07s; }
  .stagger-in > *:nth-child(3) { animation-delay: .12s; }
  .stagger-in > *:nth-child(4) { animation-delay: .17s; }
  .stagger-in > *:nth-child(5) { animation-delay: .22s; }
  @keyframes enter { to { opacity: 1; transform: translateY(0); } }
  .skeleton {
    background: linear-gradient(100deg, #f3f2ef 30%, #f7f6f3 45%, #f3f2ef 60%);
    background-size: 250% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -50% 0; } }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-backdrop { animation: backdropIn .2s var(--ease); }
  .modal-anim { animation: modalIn .35s var(--ease-spring); }
  .kpi-bar { transition: transform .7s var(--ease); transform-origin: left; will-change: transform; }
  .row-hover { transition: background-color .15s var(--ease); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  /* Reporte en PDF: window.print() sobre la pantalla normal, ocultando lo
     que no tiene sentido en papel (botones, el reproductor de video, el
     portal del video que vive fuera de #root) y mostrando un encabezado de
     reporte que en pantalla esta oculto. Nada de esto rasteriza nada: el
     texto sigue siendo texto real (seleccionable, buscable) en el PDF. */
  .solo-imprimir { display: none; }
  @media print {
    .no-imprimir, #video-player-portal, #video-compare-a-portal, #video-compare-b-portal { display: none !important; }
    .solo-imprimir { display: block !important; }
    body { background: #fff !important; }
    main { max-width: 100% !important; padding: 0 !important; }
    .shadow-xs { box-shadow: none !important; }
    a[href]:after { content: ''; }
  }
</style>
</head>
<body class="app-bg text-[#2F3437] antialiased">
<div id="root" class="min-h-screen flex flex-col"></div>

<!-- "Portal" del reproductor de video: vive FUERA de #root a proposito.
     #root se reconstruye entero (root.innerHTML = ...) en cada render(), y
     eso incluye cualquier nodo que estuviera adentro -un <video> a mitad de
     descargar 15+ MB se interrumpe si su nodo se destruye, aunque sea por
     una fraccion de segundo, y el navegador lo reporta como error aunque el
     servidor haya respondido bien (bug real, visto en DevTools: 3 peticiones
     /render con 206 cada una, todas interrumpidas). Este div se posiciona
     por JS (ver initVideoPlayer()) exactamente encima del hueco que deja
     el placeholder dentro de #root, pero el <video> en si nunca vive ahi
     adentro: nunca se destruye por un render(), sin importar cuantos
     ocurran mientras esta cargando. -->
<div id="video-player-portal" hidden style="position:absolute; z-index:5;"></div>
<div id="video-compare-b-portal" hidden style="position:absolute; z-index:5;"></div>

<script>
// ============================================================================
// GONDOLA INTELIGENTE - Dashboard (Persona 7: Datos, API y Dashboard).
// Un solo archivo HTML sin build ni npm: cualquiera del equipo lo puede
// abrir con doble clic o servirlo desde la API (backend/api.py).
//
// COMO FUNCIONA POR DENTRO
// -------------------------
// `state` guarda TODO lo que la pantalla necesita. Cada vez que algo
// cambia se llama a setState(...), que actualiza `state` y vuelve a
// dibujar toda la pantalla desde cero con render(). No hay actualizacion
// parcial del DOM: es mas simple de seguir, aunque un poco menos eficiente.
//
// QUE SE AGREGO DESPUES DE LA VERSION ORIGINAL (para quien retome esto)
// ------------------------------------------------------------------------
// 1. Mapa de calor real (renderZonesHeatmap): antes decia "PROXIMAMENTE".
//    Usa el endpoint GET /videos/{id}/zones (jerarquia gondola/estante)
//    cruzado con GET /videos/{id}/metrics (los numeros), y colorea cada
//    estante de azul claro a azul oscuro segun cuanta gente paso.
// 2. Ranking de zonas por interaccion: una lista de barras horizontales,
//    dentro de la misma seccion del mapa de calor.
// 3. Comparacion entre dos videos (renderComparisonView): apartado APARTE,
//    con su propio boton "Comparar dos videos" -no una tarjeta mas de la
//    pantalla principal, eso causaba un bug real de reproductor de video
//    en blanco al alternar entre comparar y ver un solo video.
// 4. El diagnostico (renderInsights) se movio a la columna derecha para
//    dejar la columna izquierda solo para datos crudos (tabla + mapa).
// ============================================================================

// --------------------------------------------------------------------------
// Formateo: convierten numeros/fechas crudas de la API en texto legible.
// Ninguna hace calculos de negocio, solo presentacion.
// --------------------------------------------------------------------------
function formatDwellTime(seconds) {
  if (seconds === null || seconds === undefined || isNaN(seconds)) return '—';
  if (seconds < 0) return '0.0s';
  if (seconds < 60) return `${seconds.toFixed(1)}s`;
  const minutes = Math.floor(seconds / 60);
  const remaining = Math.round(seconds % 60);
  return `${minutes}m ${remaining}s`;
}
function formatPercentage(value) {
  if (value === null || value === undefined || isNaN(value)) return '—';
  return `${(value * 100).toFixed(1)}%`;
}
function formatNumber(value) {
  if (value === null || value === undefined || isNaN(value)) return '—';
  return new Intl.NumberFormat('es-ES').format(value);
}
function calculateRejectionRate(putBack, pickUp) {
  if (putBack === null || putBack === undefined || pickUp === null || pickUp === undefined) {
    return { rate: null, label: '—', explanation: 'Sin datos suficientes' };
  }
  if (pickUp === 0) return { rate: null, label: '—', explanation: 'Sin tomas registradas' };
  const rate = putBack / pickUp;
  return { rate, label: `${(rate * 100).toFixed(1)}%`, explanation: `${putBack} de ${pickUp} tomas devueltas` };
}
// Los unicos video_id que de verdad pasaron por el pipeline completo
// (YOLO + tracking + zonas + interact + metrics) y no son un dato de
// prueba armado a mano. No hay forma de derivar esto de la respuesta de
// la API (video_demo_001/video_demo_002, por ejemplo, SI estan en
// PostgreSQL pero se insertaron a mano al principio del proyecto para
// probar la conexion API<->base de datos, no corriendo el pipeline), asi
// que esta lista se mantiene aqui, a mano, cada vez que se importa un
// video real nuevo (ver frontend/README.md, seccion de datos MERL).
const VIDEOS_REALES_CONOCIDOS = new Set([
  'video_001',
  'video_demo_merl_24_3',
  'video_demo_merl_15_3',
  'video_demo_merl_39_1',
  'video_demo_merl_18_3',
  'video_demo_merl_36_1',
]);

function isDemoVideo(videoId) {
  // "PRUEBA" es para los datos inventados a mano (MOCK_VIDEOS y compania,
  // mas abajo, cuando el modo demo esta prendido) Y para los que la API
  // real devuelve pero no estan en VIDEOS_REALES_CONOCIDOS (fixtures viejos
  // de prueba que quedaron en la base de datos, ver el comentario arriba).
  if (!state.useMockMode) return !VIDEOS_REALES_CONOCIDOS.has(videoId);
  return videoId.toLowerCase().startsWith('video_demo_');
}
function formatDuration(durationSeconds) {
  if (!durationSeconds || isNaN(durationSeconds)) return '—';
  const mins = Math.floor(durationSeconds / 60);
  const secs = Math.floor(durationSeconds % 60);
  return mins === 0 ? `${secs}s` : `${mins}m ${secs}s`;
}
function formatDateTime(isoString) {
  if (!isoString) return '—';
  try {
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString;
    return new Intl.DateTimeFormat('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
  } catch { return isoString; }
}

}

// Puntos de apoyo (pies) sinteticos para el mapa de calor real en modo demo:
// mismo formato que devuelve GET /videos/{id}/positions ({x,y} en pixeles
// del frame), agrupados en "manchas" alrededor de puntos calientes
// inventados (frente a un estante, cerca de una cabecera) en vez de
// esparcidos uniformemente, para que la densidad se vea creible.
function _mancha(cx, cy, spreadX, spreadY, n, seed) {
  const puntos = [];
  let s = seed;
  const azar = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let i = 0; i < n; i++) {
    const u1 = azar() || 1e-6;
    const u2 = azar();
    const radio = Math.sqrt(-2 * Math.log(u1));
    const angulo = 2 * Math.PI * u2;
    puntos.push({
      x: Math.round(cx + radio * Math.cos(angulo) * spreadX),
      y: Math.round(cy + radio * Math.sin(angulo) * spreadY),
    });
  }
  return puntos;
}

function cleanBaseUrl(url) { return url.trim().replace(/\/+$/, ''); }

async function fetchFromApi(url) {
  const response = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' } });
  if (!response.ok) {
    let errorDetail = `Error en la solicitud (${response.status} ${response.statusText})`;
    try {
      const errorJson = await response.json();
      if (errorJson && typeof errorJson.detail === 'string') errorDetail = errorJson.detail;
    } catch {}
    const err = new Error(errorDetail);
    err.status = response.status;
    throw err;
  }
  return response.json();
}
async function checkBackendHealth(baseUrl) {
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/health`);
}
async function getVideos(baseUrl, useMock) {
  if (useMock) return MOCK_VIDEOS;
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos`);
}
async function getVideoDetail(baseUrl, videoId, useMock) {
  if (useMock) {
    const mock = MOCK_DETAILS[videoId];
    if (mock) return mock;
    const err = new Error(`El video '${videoId}' no existe en el registro del sistema de vision.`);
    err.status = 404;
    throw err;
  }
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos/${encodeURIComponent(videoId)}`);
}
async function getVideoMetrics(baseUrl, videoId, useMock) {
  if (useMock) return MOCK_METRICS[videoId] || [];
  return fetchFromApi(`${cleanBaseUrl(baseUrl)}/videos/${encodeURIComponent(videoId)}/metrics`);
}

async function verifyHealth() {
  setState({ isCheckingHealth: true });
  try {
    const res = await checkBackendHealth(state.apiBaseUrl);
    setState({ isBackendHealthy: res.status === 'ok', isCheckingHealth: false });
  } catch {
    setState({ isBackendHealthy: false, isCheckingHealth: false });
  }
}

async function loadVideos() {
  setState({ isLoadingVideos: true, errorVideos: null });
  try {
    const data = await getVideos(state.apiBaseUrl, state.useMockMode);
    const exists = data.some((v) => v.video_id === state.selectedVideoId);
    // Sin auto-elegir el primero: si el video que ya estaba elegido sigue
    // existiendo, se queda; si no (o si nunca se habia elegido ninguno),
    // se deja vacio -la persona elige, el panel no le impone un video-.
    setState({
      videos: data,
      isLoadingVideos: false,
      selectedVideoId: exists ? state.selectedVideoId : '',
      videoDetail: exists ? state.videoDetail : null,
      zoneMetrics: exists ? state.zoneMetrics : [],
    });
    if (state.selectedVideoId) {
      loadVideoDetail(state.selectedVideoId);
      loadVideoMetrics(state.selectedVideoId);
      loadZoneHierarchy(state.selectedVideoId);
      loadPositions(state.selectedVideoId);
    }
  } catch (err) {
    setState({ errorVideos: err.message || 'Error de red al conectar con GET /videos', isLoadingVideos: false });
  }
}

async function loadVideoDetail(videoId) {
  if (!videoId) return;
  setState({ isLoadingDetail: true, errorDetail: null });
  try {
    const detail = await getVideoDetail(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ videoDetail: detail, isLoadingDetail: false });
  } catch (err) {
    setState({ errorDetail: err.message || `Error al consultar detalles de ${videoId}`, videoDetail: null, isLoadingDetail: false });
  }
}

async function loadVideoMetrics(videoId) {
  if (!videoId) return;
  setState({ isLoadingMetrics: true, errorMetrics: null });
  try {
    const metrics = await getVideoMetrics(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ zoneMetrics: metrics, isLoadingMetrics: false });
  } catch (err) {
    setState({ errorMetrics: err.message || `Error al consultar metricas de zonas para ${videoId}`, zoneMetrics: [], isLoadingMetrics: false });
  }
}

// Trae la jerarquia de zonas (que estante pertenece a que gondola) para
// poder agrupar el mapa de calor. Es un pedido APARTE de loadVideoMetrics:
// metrics.js da los NUMEROS, este endpoint da la ESTRUCTURA (quien es hijo
// de quien). Se cruzan por zone_id al momento de dibujar.
async function loadZoneHierarchy(videoId) {
  if (!videoId) return;
  setState({ isLoadingHierarchy: true });
  try {
    const hierarchy = state.useMockMode
      ? MOCK_ZONE_HIERARCHY[videoId] || []
      : await fetchFromApi(`${cleanBaseUrl(state.apiBaseUrl)}/videos/${encodeURIComponent(videoId)}/zones`);
    setState({ zoneHierarchy: hierarchy, isLoadingHierarchy: false });
  } catch {
    setState({ zoneHierarchy: [], isLoadingHierarchy: false });
  }
}

// Punto de apoyo (los pies) de cada evento del video, en pixeles del frame
// original -la materia prima de un mapa de calor REAL (densidad espacial),
// no un agregado por zona. Puede ser una lista larga (miles de puntos):
// se pide una sola vez por video, no en cada render().
async function loadPositions(videoId) {
  if (!videoId) return;
  setState({ isLoadingPositions: true });
  try {
    const positions = state.useMockMode
      ? MOCK_POSITIONS[videoId] || []
      : await fetchFromApi(`${cleanBaseUrl(state.apiBaseUrl)}/videos/${encodeURIComponent(videoId)}/positions`);
    setState({ positions, isLoadingPositions: false });
  } catch {
    setState({ positions: [], isLoadingPositions: false });
  }
}

// Trae el PAQUETE COMPLETO (detalle + metricas + jerarquia de zonas +
// posiciones) de un video para la vista de comparacion (ver
// renderComparisonView) -el mismo paquete que trae selectVideo() para el
// video principal, para que la comparacion pueda mostrar TODO de cada
// lado, no solo 4 numeros sueltos-. `slot` es 'A' o 'B': cada lado se
// carga y guarda aparte, para poder cambiar uno sin perder el otro.
async function loadCompareData(slot, videoId) {
  const k = (sufijo) => `compare${slot}${sufijo}`;

  if (!videoId) {
    setState({
      [k('')]: '', [k('Detail')]: null,
      [k('Metrics')]: [], [k('Hierarchy')]: [], [k('Positions')]: [],
    });
    return;
  }
  setState({ [k('')]: videoId, [`isLoadingCompare${slot}`]: true });
  try {
    const detail = await getVideoDetail(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ [k('Detail')]: detail, [`isLoadingCompare${slot}`]: false });
  } catch {
    setState({ [k('Detail')]: null, [`isLoadingCompare${slot}`]: false });
  }

  setState({ [`isLoadingCompare${slot}Metrics`]: true });
  try {
    const metrics = await getVideoMetrics(state.apiBaseUrl, videoId, state.useMockMode);
    setState({ [k('Metrics')]: metrics, [`isLoadingCompare${slot}Metrics`]: false });
  } catch {
    setState({ [k('Metrics')]: [], [`isLoadingCompare${slot}Metrics`]: false });
  }

  setState({ [`isLoadingCompare${slot}Hierarchy`]: true });
  try {
    const hierarchy = state.useMockMode
      ? MOCK_ZONE_HIERARCHY[videoId] || []
      : await fetchFromApi(`${cleanBaseUrl(state.apiBaseUrl)}/videos/${encodeURIComponent(videoId)}/zones`);
    setState({ [k('Hierarchy')]: hierarchy, [`isLoadingCompare${slot}Hierarchy`]: false });
  } catch {
    setState({ [k('Hierarchy')]: [], [`isLoadingCompare${slot}Hierarchy`]: false });
  }

  setState({ [`isLoadingCompare${slot}Positions`]: true });
  try {
    const positions = state.useMockMode
      ? MOCK_POSITIONS[videoId] || []
      : await fetchFromApi(`${cleanBaseUrl(state.apiBaseUrl)}/videos/${encodeURIComponent(videoId)}/positions`);
    setState({ [k('Positions')]: positions, [`isLoadingCompare${slot}Positions`]: false });
  } catch {
    setState({ [k('Positions')]: [], [`isLoadingCompare${slot}Positions`]: false });
  }
}

// Cuando se elige un video nuevo en el selector principal, se piden sus
// tres piezas de datos EN PARALELO (no una espera a la otra): el resumen,
// las metricas por zona, y la jerarquia de zonas.
function selectVideo(videoId) {
  setState({ selectedVideoId: videoId });
  loadVideoDetail(videoId);
  loadVideoMetrics(videoId);
  loadZoneHierarchy(videoId);
  loadPositions(videoId);
}

}

            ${options}

        <button type="button" data-action="abrir-comparacion"

          ${icon('refresh-cw', `w-3 h-3 ${state.isLoadingVideos ? 'animate-spin' : ''}`)}
          <span class="text-[11px]">Actualizar</span>

      ${meta}
    </div>

  </div>
  <div class="solo-imprimir" style="margin-bottom:1rem">
    <h1 style="font-size:1.25rem;font-weight:700">Góndola Inteligente — Reporte de análisis</h1>
    ${current ? `<p style="font-size:0.8rem;color:#57534E">Video: ${esc(current.source_name || current.video_id)} (${esc(current.video_id)}) — ${isDemo ? 'DATOS DE PRUEBA' : 'Producción real'} — generado ${esc(new Date().toLocaleString('es-CO'))}</p>` : ''}
  </div>`;
}

function metricCard({ id, title, value, subtext, badge, tone = 'neutral', tooltip, highlight = false, barColor = '#1F6C9F', progressPercent = 50, countTarget = null }) {
  const toneClasses = { accent: 'text-[#346538]', warning: 'text-[#B8790B]', danger: 'text-[#9F2F2D]', info: 'text-[#1F6C9F]', neutral: 'text-[#787774]' };
  const clamped = Math.min(100, Math.max(0, progressPercent));
  const valueHtml = countTarget !== null
    ? `<span class="text-2xl sm:text-3xl font-bold tracking-tight text-[#111111] tabular-nums" data-count-target="${countTarget}">0</span>`
    : `<span class="text-2xl sm:text-3xl font-bold tracking-tight text-[#111111] tabular-nums">${value}</span>`;
  return `
  <div id="${id}" class="p-4 rounded-xl border card-lift flex flex-col justify-between shadow-xs ${highlight ? 'bg-white border-[#1F6C9F]/40 ring-1 ring-[#1F6C9F]/20' : 'bg-white border-[#EAEAEA]'}">
    <div class="flex items-center justify-between gap-1 mb-1">
      <span class="text-[10px] font-bold text-[#787774] uppercase tracking-[0.1em] truncate" title="${esc(title)}">${esc(title)}</span>
      ${tooltip ? `<span class="cursor-help text-[#A8A29E] hover:text-[#787774] transition-colors" title="${esc(tooltip)}">${icon('help-circle', 'w-3 h-3')}</span>` : ''}
    </div>
    <div class="my-1">
      <div class="flex items-baseline gap-2">
        ${valueHtml}
        ${badge ? `<span class="text-xs font-medium truncate ${toneClasses[tone]}">${esc(badge)}</span>` : ''}
      </div>
      <p class="text-[11px] text-[#787774] truncate mt-0.5" title="${esc(subtext)}">${esc(subtext)}</p>
    </div>
    <div class="w-full bg-[#F3F2EF] h-1 rounded-full overflow-hidden mt-2">
      <div class="h-full w-full kpi-bar rounded-full" style="transform:scaleX(${clamped / 100});background-color:${barColor}"></div>
    </div>
  </div>`;
}

// Video anonimizado (RENDER_MODE=privacy del AI Service): PILOTO, solo
// para probar si el equipo lo quiere -ver GET /videos/{id}/render en
// backend/api.py-. No existe en modo demo (los datos de MOCK_* no tienen
// ningun archivo de video detras, solo numeros inventados a mano) y no
// todos los videos reales tienen este render generado, por eso el
// manejo de error inline: si el archivo no esta, se oculta el
// reproductor roto y se muestra un aviso en vez de un cuadro negro.
function renderVideoPlayer() {
  // No solo "modo demo global apagado": un video de PRUEBA especifico
  // (video_demo_001/002, fixtures armados a mano en la base de datos, ver
  // isDemoVideo()) tampoco tiene ningun render real detras, aunque el
  // modo demo global este apagado -si no, el reproductor intenta cargar
  // y siempre muestra "no disponible", que no aporta nada a quien esta
  // viendo un dato de prueba a proposito.
  if (!state.selectedVideoId || isDemoVideo(state.selectedVideoId)) return '';
  // El <video> de verdad NO va aqui adentro: vive en #video-player-portal,
  // FUERA de #root (ver el <body> y el comentario grande junto a
  // initVideoPlayer(), mas abajo). Este div es solo un HUECO -con una
  // altura fija, para que el portal sepa que tamano ocupar- que reserva el
  // espacio en el layout normal de la pagina.
  return `
  <div class="no-imprimir bg-white rounded-xl border border-[#EAEAEA] p-4 sm:p-5 shadow-xs">
    <div class="flex items-center gap-2.5 mb-3">
      <div class="w-7 h-7 rounded-lg bg-[#F3F2EF] text-[#787774] flex items-center justify-center shrink-0">${icon('video-camera', 'w-4 h-4')}</div>
      <div>
        <h3 class="text-sm font-bold text-[#111111]">Video anonimizado</h3>
        <p class="text-[11px] text-[#787774]">Sin imágenes reales de la tienda — solo la detección</p>
      </div>
    </div>
    <div id="video-player-placeholder" class="w-full rounded-lg bg-[#0B1220]" style="height:400px"></div>
  </div>`;
}

// Cada <video> vive en su propio portal, un nodo FUERA de #root creado una
// sola vez en el <body> (ver ahi el comentario completo). #root se
// reconstruye entero (root.innerHTML = ...) en cada render() -zonas,
// posiciones y metricas llegan en momentos distintos, y cada una dispara
// su propio render()-, y un <video> a mitad de descargar 13+ MB no
// sobrevive eso: el navegador reporta la interrupcion como error de
// reproduccion aunque el servidor haya respondido bien (bug real, visto en
// DevTools: varias peticiones /render con 206 Partial Content -correctas-
// pero el reproductor igual mostraba "no disponible", porque su nodo se
// destruia y recreaba en medio de la descarga).
//
// crearReproductorPersistente() no MUEVE el <video> a ningun lado (a
// diferencia de un primer intento con appendChild, que resulto no ser
// suficiente): lo deja donde esta siempre y solo reposiciona el portal, con
// CSS, encima del hueco (el `placeholderId` que le pasen a .init()) que
// exista en ese momento dentro de #root. El <video> nunca esta dentro de
// #root, ni un instante.
//
// Hace falta un reproductor por CADA video que pueda estar en pantalla a
// la vez: uno para el panel de un solo video (reproductorA, reutilizado
// tambien como "Video A" en la vista de comparacion) y otro para "Video B"
// de esa misma vista (reproductorB). Nunca los dos paneles a la vez, pero
// SI dos videos a la vez dentro de la comparacion.
function crearReproductorPersistente(portalId) {
  const portal = document.getElementById(portalId);
  const video = document.createElement('video');
  video.controls = true;
  video.preload = 'metadata';
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.borderRadius = '0.5rem';
  video.style.display = 'block';

  const errorBox = document.createElement('p');
  errorBox.hidden = true;
  errorBox.className = 'text-xs text-[#956400] bg-[#FBF3DB] rounded-lg px-3 py-2.5 mt-2';
  errorBox.textContent = 'Este video todavía no tiene un render "privacy" generado en el servidor (o la API no responde).';

  portal.appendChild(video);
  portal.appendChild(errorBox);
  video.addEventListener('error', () => {
    video.style.display = 'none';
    errorBox.hidden = false;
  });

  let ultimoSrc = null;

  function posicionar(placeholderId) {
    const placeholder = document.getElementById(placeholderId);
    if (!placeholder) { portal.hidden = true; return null; }
    const rect = placeholder.getBoundingClientRect();
    portal.style.top = `${window.scrollY + rect.top}px`;
    portal.style.left = `${window.scrollX + rect.left}px`;
    portal.style.width = `${rect.width}px`;
    portal.style.height = `${rect.height}px`;
    portal.hidden = false;
    return placeholder;
  }

  return {
    init(placeholderId, src) {
      const placeholder = posicionar(placeholderId);
      if (!placeholder) return;
      if (src === ultimoSrc) return; // mismo video: no tocar .src o se reinicia la carga sin necesidad
      ultimoSrc = src;
      video.style.display = 'block';
      errorBox.hidden = true;
      video.src = src;
    },
    ocultar() { portal.hidden = true; },
    reposicionar(placeholderId) { if (!portal.hidden) posicionar(placeholderId); },
  };
}

const reproductorA = crearReproductorPersistente('video-player-portal');
const reproductorB = crearReproductorPersistente('video-compare-b-portal');

window.addEventListener('resize', () => {
  if (state.mostrandoComparacion) {
    reproductorA.reposicionar('video-compare-a-placeholder');
    reproductorB.reposicionar('video-compare-b-placeholder');
  } else {
    reproductorA.reposicionar('video-player-placeholder');
  }
});

function _urlDeRender(videoId) {
  return `${cleanBaseUrl(state.apiBaseUrl)}/videos/${encodeURIComponent(videoId)}/render`;
}

function _initSlot(reproductor, placeholderId, videoId) {
  if (!videoId || isDemoVideo(videoId)) { reproductor.ocultar(); return; }
  reproductor.init(placeholderId, _urlDeRender(videoId));
}

function initVideoPlayer() {
  if (state.mostrandoComparacion) {
    _initSlot(reproductorA, 'video-compare-a-placeholder', state.compareA);
    _initSlot(reproductorB, 'video-compare-b-placeholder', state.compareB);
  } else {
    _initSlot(reproductorA, 'video-player-placeholder', state.selectedVideoId);
    reproductorB.ocultar();
  }
}

// "Retroalimentación": por que salieron estos numeros, en lenguaje llano,
// justo debajo del selector de video -para que alguien pueda entender un
// resultado raro (una tasa en 0%, un conteo de personas que no cuadra) SIN
// tener que abrir el video y mirarlo entero-. A proposito NO es el mismo
// texto que renderInsights() (mas abajo, columna derecha): insights
// sugiere una ACCION de negocio ("subir cartelería"); esto explica el
// COMPORTAMIENTO DEL DATO/PIPELINE ("por que da 0", "por que esa tasa no
// se mueve", "por que ese conteo de personas no es literal"). Son reglas
// simples sobre los numeros que ya llegaron, nada de IA ni llamada extra.
// Junta todo lo que un video necesita para renderizarse por completo
// (detalle, metricas de zona, jerarquia, posiciones) en un solo objeto,
// para que renderSummaryCards/renderZonesSection/renderPositionsHeatmap/
// renderZonesHeatmap/renderFeedback puedan dibujar CUALQUIER video -el
// principal o cualquiera de los dos de la comparacion- sin duplicar su
// logica. Sin argumento devuelve el paquete del video principal (mismo
// comportamiento que antes de que existiera la comparacion).
function bundleDe(slot) {
  if (!slot) {
    return {
      videoId: state.selectedVideoId,
      detail: state.videoDetail, isLoadingDetail: state.isLoadingDetail,
      metrics: state.zoneMetrics, isLoadingMetrics: state.isLoadingMetrics, errorMetrics: state.errorMetrics,
      hierarchy: state.zoneHierarchy, isLoadingHierarchy: state.isLoadingHierarchy,
      positions: state.positions, isLoadingPositions: state.isLoadingPositions,
      heatmapId: 'positions-heatmap-canvas',
    };
  }
  return {
    videoId: state[`compare${slot}`],
    detail: state[`compare${slot}Detail`], isLoadingDetail: state[`isLoadingCompare${slot}`],
    metrics: state[`compare${slot}Metrics`], isLoadingMetrics: state[`isLoadingCompare${slot}Metrics`], errorMetrics: null,
    hierarchy: state[`compare${slot}Hierarchy`], isLoadingHierarchy: state[`isLoadingCompare${slot}Hierarchy`],
    positions: state[`compare${slot}Positions`], isLoadingPositions: state[`isLoadingCompare${slot}Positions`],
    heatmapId: `positions-heatmap-canvas-${slot.toLowerCase()}`,
  };
}

// Logica pura (sin HTML): las mismas reglas simples sobre los numeros ya
// calculados, en un arreglo de {titulo, texto}. Separada de renderFeedback()
// para que el boton de exportar (PDF/CSV, ver generarReporteTexto()) pueda
// reutilizar EXACTAMENTE el mismo texto que ve la persona en pantalla, sin
// mantener dos copias del mismo razonamiento.
function generarNotasFeedback(bundle) {
  if (!bundle.detail) return [];
  const d = bundle.detail;
  const zones = bundle.metrics;
  const notas = [];

  if (d.pick_up_count === 0) {
    notas.push({
      titulo: 'Cero tomas de producto detectadas (PICK_UP)',
      texto: d.interaction_count > 0
        ? `Hubo ${formatNumber(d.interaction_count)} acercamiento(s) al estante, pero ninguno se clasificó como una toma real. Puede ser que de verdad nadie se llevó nada, o que el gesto fue muy breve, con las manos ocultas, o quedó justo en el borde del umbral de detección — es una limitación conocida del pipeline, no necesariamente lo que pasó en la tienda.`
        : `La góndola tuvo muy poco o ningún tránsito frente a ella en este clip: sin acercamientos, no hay de dónde sacar una toma.`,
    });
  }

  if (d.pick_up_count > 0 && d.put_back_count === 0) {
    notas.push({
      titulo: 'Tasa de rechazo en 0% — no se mueve porque no hay con qué compararla',
      texto: `Con ${formatNumber(d.pick_up_count)} toma(s) y 0 devoluciones registradas, la fórmula (devoluciones ÷ tomas) siempre da 0%, sin importar cuántas tomas haya. Puede significar que el producto convenció al 100% de quien lo tomó, pero también que el video es muy corto para capturar una devolución, o que PUT_BACK es un gesto más ambiguo de detectar que PICK_UP con el mismo umbral.`,
    });
  } else if (d.pick_up_count === 0) {
    notas.push({
      titulo: 'Tasa de rechazo no calculable (—), no es lo mismo que 0%',
      texto: `Sin ninguna toma detectada no hay denominador: el guion (—) es un dato ausente, no una devolución de "cero por ciento" que sí se pueda comparar contra otro video.`,
    });
  }

  if (d.duration_s && d.duration_s < 180 && d.people_count > 0) {
    notas.push({
      titulo: `Video corto (${formatDuration(d.duration_s)}): las tasas son poco estables`,
      texto: `Con solo ${formatNumber(d.people_count)} persona(s) distinta(s) detectada(s), cada una pesa mucho en el promedio — una sola toma o devolución de más o de menos mueve cualquier porcentaje varios puntos. No lo trates como una muestra representativa, es una demostración puntual del pipeline.`,
    });
  }

  if (bundle.videoId.startsWith('video_demo_merl_') && d.people_count > 4) {
    notas.push({
      titulo: `¿${formatNumber(d.people_count)} personas distintas en un clip pensado para una sola?`,
      texto: `Este video viene del dataset público MERL Shopping Dataset, grabado con un único sujeto por clip. Que el sistema cuente ${formatNumber(d.people_count)} "personas distintas" probablemente significa que el rastreador perdió a esa persona en algún momento (una oclusión, un giro brusco) y la volvió a enganchar como si fuera alguien nuevo, no que hayan pasado ${formatNumber(d.people_count)} personas reales por la cámara. Es una limitación conocida del tracking, ver el bug ya documentado de video_001.`,
    });
  }

  const zonaMuyActiva = zones.find((z) => z.interaction_rate !== null && z.interaction_rate >= 0.9 && (z.people_count || 0) >= 3);
  if (zonaMuyActiva) {
    notas.push({
      titulo: `${zonaMuyActiva.name}: casi todo el que pasa "interactúa" (${formatPercentage(zonaMuyActiva.interaction_rate)})`,
      texto: `Puede ser que el estante de verdad atraiga a casi cualquiera que se acerque, o que el área de piso calibrada (floor_zone en data/zones/) sea tan ancha que capture a quien solo camina cerca, no solo a quien se detiene a mirar. Si este patrón se repite en todos los videos, vale la pena revisar esa calibración antes de confiar en el número.`,
    });
  }

  return notas;
}

function csvEscape(valor) {
  const texto = String(valor ?? '');
  return /[",\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
}

// Descarga un .csv (Excel lo abre directo, sin ningun plugin ni libreria
// nueva) con TODO lo que ve la persona del video elegido: resumen general,
// tabla por zona y las mismas notas de retroalimentacion -reutiliza
// generarNotasFeedback(), el mismo texto que ya se ve en pantalla, para que
// el reporte nunca diga algo distinto de lo que muestra el dashboard.
function exportarCSV() {
  const bundle = bundleDe();
  const d = bundle.detail;
  if (!d) return;
  const current = state.videos.find((v) => v.video_id === bundle.videoId);
  const rejection = calculateRejectionRate(d.put_back_count, d.pick_up_count);
  const filas = [];

  filas.push(['Góndola Inteligente - Reporte']);
  filas.push(['Video', current ? (current.source_name || d.video_id) : d.video_id]);
  filas.push(['video_id', d.video_id]);
  filas.push(['Generado', new Date().toLocaleString('es-CO')]);
  filas.push([]);

  filas.push(['Resumen general']);
  filas.push(['Métrica', 'Valor']);
  filas.push(['Personas detectadas', d.people_count]);
  filas.push(['Interacciones', d.interaction_count]);
  filas.push(['Pick-ups', d.pick_up_count]);
  filas.push(['Put-backs', d.put_back_count]);
  filas.push(['Tasa de rechazo', rejection.label]);
  filas.push(['Permanencia media (s)', d.average_dwell_time_s ?? '']);
  filas.push([]);

  filas.push(['Análisis por zona']);
  filas.push(['Zona', 'Nivel', 'Categoría', 'Personas', 'Interacción %', 'Pick-ups', 'Put-backs', 'Permanencia (s)', 'Conversión %']);
  bundle.metrics.forEach((z) => {
    filas.push([
      z.name,
      z.level === 'gondola' ? 'Góndola' : z.level === 'shelf' ? 'Estante' : 'Zona',
      z.product_category || '',
      z.people_count,
      z.interaction_rate !== null ? Math.round(z.interaction_rate * 100) : '',
      z.pick_up_count,
      z.put_back_count,
      z.average_dwell_time_s ?? '',
      z.conversion_rate !== null ? Math.round(z.conversion_rate * 100) : '',
    ]);
  });
  filas.push([]);

  const notas = generarNotasFeedback(bundle);
  if (notas.length) {
    filas.push(['Retroalimentación']);
    filas.push(['Título', 'Explicación']);
    notas.forEach((n) => filas.push([n.titulo, n.texto]));
  }

  const csv = filas.map((fila) => fila.map(csvEscape).join(',')).join('\r\n');
  // BOM al inicio: sin esto, Excel abre el archivo asumiendo la
  // codificacion del sistema y las tildes/eñes salen mal.
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = `gondola-inteligente_${d.video_id}.csv`;
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  URL.revokeObjectURL(url);
}

function renderFeedback(bundle = bundleDe()) {
  const notas = generarNotasFeedback(bundle);
  if (!notas.length) return '';

  const items = notas.slice(0, 4).map((n) => `
    <div class="flex gap-2.5">
      <div class="w-5 h-5 rounded-full bg-[#F3F2EF] text-[#787774] flex items-center justify-center shrink-0 mt-0.5">${icon('help-circle', 'w-3 h-3')}</div>
      <div>
        <p class="text-xs font-bold text-[#111111] leading-snug">${esc(n.titulo)}</p>
        <p class="text-[11px] text-[#57534E] leading-relaxed mt-0.5">${esc(n.texto)}</p>
      </div>

  return `

      <div class="w-7 h-7 rounded-lg bg-[#FBF3DB] text-[#956400] flex items-center justify-center shrink-0">${icon('help-circle', 'w-4 h-4')}</div>
      <div>
        <h3 class="text-sm font-bold text-[#111111]">Retroalimentación: por qué salen estos números</h3>

// Los mismos 4 numeros de dos videos, uno al lado del otro. Pura
// presentacion: no hace ninguna cuenta nueva, solo reutiliza los resumenes
// que ya trajo loadCompareData() para cada lado.
function renderCompareNumbers(a, b) {
  const rejA = calculateRejectionRate(a.put_back_count, a.pick_up_count);
  const rejB = calculateRejectionRate(b.put_back_count, b.pick_up_count);

  const compareRow = (label, va, vb, fmt = formatNumber) => `
    <div class="grid grid-cols-3 items-center gap-2 py-2.5 border-b border-[#F3F2EF] last:border-0">
      <div class="text-sm font-bold text-[#111111] text-right tabular-nums">${fmt(va)}</div>
      <div class="text-[10px] text-[#787774] uppercase tracking-wider text-center">${esc(label)}</div>
      <div class="text-sm font-bold text-[#111111] tabular-nums">${fmt(vb)}</div>
    </div>`;

  return `
  <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs space-y-1">
    <div class="grid grid-cols-3 items-center text-center pb-2 border-b border-[#EAEAEA]">
      <div class="text-xs font-semibold text-[#1F6C9F] truncate" title="${esc(a.source_name || a.video_id)}">${esc(a.source_name || a.video_id)}</div>
      <div class="text-[10px] text-[#A8A29E] font-bold">VS</div>
      <div class="text-xs font-semibold text-[#1F6C9F] truncate" title="${esc(b.source_name || b.video_id)}">${esc(b.source_name || b.video_id)}</div>
    </div>
    ${compareRow('Personas', a.people_count, b.people_count)}
    ${compareRow('Interacciones', a.interaction_count, b.interaction_count)}
    ${compareRow('Permanencia', a.average_dwell_time_s, b.average_dwell_time_s, formatDwellTime)}
    ${compareRow('Tasa de rechazo', rejA.rate !== null ? Math.round(rejA.rate * 100) + '%' : '—', rejB.rate !== null ? Math.round(rejB.rate * 100) + '%' : '—', (v) => v)}
  </div>`;
}

// Una columna COMPLETA para un video de la comparacion: mismo contenido
// que ve alguien mirando un solo video (video, resumen, zonas, mapa de
// calor, resumen de zona, retroalimentacion) -antes esta vista solo traia
// 4 numeros sueltos, y eso no alcanzaba para comparar de verdad dos
// videos-. Reutiliza exactamente las mismas funciones de render que el
// panel principal, pasandoles el bundle de este slot en vez del video
// principal.
function renderVideoColumn(slot) {
  const bundle = bundleDe(slot);
  const videoId = bundle.videoId;
  if (!videoId) {
    return `
    <div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] p-8 text-center text-xs text-[#787774]" style="min-height:220px">
      Elige el video ${slot} arriba para ver su análisis completo
    </div>`;
  }

  const current = state.videos.find((v) => v.video_id === videoId);
  const demo = isDemoVideo(videoId);
  const placeholderId = `video-compare-${slot.toLowerCase()}-placeholder`;
  const idPrefix = slot.toLowerCase();

  const videoCard = demo
    ? `<div class="bg-white rounded-xl border border-[#EAEAEA] p-5 flex items-center justify-center text-center text-xs text-[#787774]" style="min-height:220px">Video de prueba: sin grabación real que mostrar</div>`
    : `<div class="bg-white rounded-xl border border-[#EAEAEA] p-3 shadow-xs"><div id="${placeholderId}" class="w-full rounded-lg bg-[#0B1220]" style="height:220px"></div></div>`;

  return `
  <div class="space-y-4">
    <div class="flex items-center gap-2 pb-1">
      <span class="w-6 h-6 rounded-full bg-[#1F6C9F] text-white text-xs font-bold flex items-center justify-center shrink-0">${slot}</span>
      <h3 class="text-sm font-bold text-[#111111] truncate" title="${esc(current ? current.source_name : videoId)}">${esc(current ? current.source_name : videoId)}</h3>
      <span class="text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${demo ? 'bg-[#FBF3DB] text-[#956400]' : 'bg-[#EDF3EC] text-[#346538]'}">${demo ? 'PRUEBA' : 'REAL'}</span>
    </div>
    ${videoCard}
    ${renderSummaryCards(bundle, idPrefix)}
    ${renderZonesSection(bundle, `${idPrefix}-`)}
    ${renderPositionsHeatmap(bundle)}
    ${renderZonesHeatmap(bundle)}
    ${renderFeedback(bundle)}
  </div>`;
}

// Apartado APARTE de la pantalla principal (ver "mostrandoComparacion" en
// state y el boton "Comparar dos videos" en renderVideoSelector): dos
// selectores arriba, un digest rapido de 4 numeros, y debajo las DOS
// columnas completas (renderVideoColumn) una al lado de la otra. Vivir
// separado del panel de un solo video es lo que evita el bug de
// reproductor en blanco que habia antes (ver el comentario junto a
// "mostrandoComparacion" en el objeto state).
function renderComparisonView() {
  // El video ya elegido en el OTRO slot no aparece en esta lista: comparar
  // un video contra si mismo no tiene sentido (todas las cifras saldrian
  // identicas, y confundiria mas que ayudaria).
  const selector = (slot, valorActual, idDelOtroLado) => `
    <div class="flex items-center gap-2 px-3 py-1.5 bg-[#F3F2EF] rounded-md border border-[#EAEAEA] flex-1 min-w-[220px]">
      <span class="text-xs font-medium text-[#57534E] uppercase tracking-wider shrink-0">Video ${slot}:</span>
      <select data-compare-slot="${slot}" class="bg-transparent text-sm font-semibold text-[#2F3437] outline-none cursor-pointer w-full py-0.5">
        <option value="">Elegir…</option>
        ${state.videos.filter((v) => v.video_id !== idDelOtroLado).map((v) => `<option value="${esc(v.video_id)}" ${v.video_id === valorActual ? 'selected' : ''}>${esc(v.source_name || v.video_id)} ${isDemoVideo(v.video_id) ? '(Prueba)' : '(Real)'}</option>`).join('')}
      </select>
    </div>`;

  const numeros = (!state.compareADetail || !state.compareBDetail)
    ? (state.isLoadingCompareA || state.isLoadingCompareB
        ? `<div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs"><div class="h-4 skeleton rounded w-48 mb-3"></div><div class="h-20 skeleton rounded-lg"></div></div>`
        : `<div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] p-5 text-center text-xs text-[#787774]">Elige los dos videos para ver la comparación completa.</div>`)
    : renderCompareNumbers(state.compareADetail, state.compareBDetail);

  return `
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-5 space-y-4">
    <button type="button" data-action="cerrar-comparacion"
            class="inline-flex items-center gap-1.5 text-sm font-medium text-[#1F6C9F] hover:text-[#18567D] transition-colors">
      ${icon('arrow-left', 'w-4 h-4')} Volver al panel principal
    </button>
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-4 shadow-xs">
      <h2 class="text-sm font-bold text-[#111111] mb-3">Comparar dos videos</h2>
      <div class="flex flex-col sm:flex-row gap-3">
        ${selector('A', state.compareA, state.compareB)}
        ${selector('B', state.compareB, state.compareA)}
      </div>
    </div>
    ${numeros}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      ${renderVideoColumn('A')}
      ${renderVideoColumn('B')}
    </div>
  </main>`;
}

function renderSummaryCards(bundle = bundleDe(), idPrefix = '') {
  if (bundle.isLoadingDetail || !bundle.detail) {
    if (!bundle.isLoadingDetail) return '';
    const skeletons = Array.from({ length: 6 }).map(() => `
      <div class="h-28 bg-white p-4 rounded-xl border border-[#EAEAEA] flex flex-col justify-between shadow-xs overflow-hidden">
        <div class="h-3 skeleton rounded w-20"></div>
        <div class="h-7 skeleton rounded w-16"></div>
        <div class="w-full bg-[#F3F2EF] h-1 rounded-full"></div>
      </div>`).join('');
    return `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">${skeletons}</div>`;
  }

  const d = bundle.detail;
  const rejection = calculateRejectionRate(d.put_back_count, d.pick_up_count);
  const interactionRateVal = d.people_count > 0 ? Math.min(100, Math.round((d.interaction_count / d.people_count) * 100)) : 0;
  const pickUpProgress = d.interaction_count > 0 ? Math.min(100, Math.round((d.pick_up_count / d.interaction_count) * 100)) : (d.pick_up_count > 0 ? 50 : 0);
  const putBackProgress = d.pick_up_count > 0 ? Math.min(100, Math.round((d.put_back_count / d.pick_up_count) * 100)) : 0;
  const dwellProgress = Math.min(100, Math.round(((d.average_dwell_time_s || 0) / 20) * 100));
  const mid = (nombre) => idPrefix ? `metric-${idPrefix}-${nombre}` : `metric-${nombre}`;

  return `
  <section aria-labelledby="kpi-summary-heading${idPrefix}" class="space-y-2">
    <div class="flex items-center justify-between px-1">
      <h2 id="kpi-summary-heading${idPrefix}" class="text-[10px] font-bold text-[#787774] uppercase tracking-[0.1em]">Resumen General del Video</h2>
      <span class="text-[11px] text-[#787774]">Grabación: <code class="font-mono text-[#111111]">${esc(d.video_id)}</code></span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
      ${metricCard({ id: mid('people-count'), title: 'Tráfico Total', value: formatNumber(d.people_count), countTarget: d.people_count, subtext: 'personas detectadas', badge: '100% Anónimo', tone: 'neutral', barColor: '#1F6C9F', progressPercent: d.people_count > 0 ? 65 : 0, tooltip: 'Conteo de identificadores de seguimiento únicos (track_id temporales) detectados en el área del pasillo.' })}
      ${metricCard({ id: mid('interaction-count'), title: 'Interacciones', value: formatNumber(d.interaction_count), countTarget: d.interaction_count, subtext: `${interactionRateVal}% rate`, badge: `${d.people_count > 0 ? (d.interaction_count / d.people_count).toFixed(1) : '0'} / pers`, tone: 'info', barColor: '#1F6C9F', progressPercent: interactionRateVal, tooltip: 'Eventos donde un cliente se detuvo dentro de la zona de atención de la góndola.' })}
      ${metricCard({ id: mid('pick-up-count'), title: 'Pick-ups', value: formatNumber(d.pick_up_count), countTarget: d.pick_up_count, subtext: 'productos tomados', badge: 'Extracción', tone: 'accent', barColor: '#1F6C9F', progressPercent: pickUpProgress, tooltip: 'Veces que la mano de un cliente tomó un producto de la góndola según el modelo de interacción.' })}
      ${metricCard({ id: mid('put-back-count'), title: 'Put-backs', value: formatNumber(d.put_back_count), countTarget: d.put_back_count, subtext: 'devoluciones', badge: d.put_back_count === 0 ? '0 devueltos' : `${d.put_back_count} reposiciones`, tone: d.put_back_count === 0 ? 'accent' : 'danger', barColor: '#9F2F2D', progressPercent: putBackProgress, tooltip: 'Veces que un producto previamente levantado fue colocado nuevamente en la góndola.' })}
      ${metricCard({ id: mid('rejection-rate'), title: 'Tasa Rechazo', value: rejection.label, subtext: rejection.rate === null ? 'sin tomas' : 'devolución', badge: rejection.rate === null ? 'N/A' : (rejection.rate > 0.3 ? 'Atención' : 'Óptimo'), tone: rejection.rate === null ? 'neutral' : (rejection.rate > 0.3 ? 'danger' : 'accent'), barColor: rejection.rate && rejection.rate > 0.3 ? '#9F2F2D' : '#346538', progressPercent: rejection.rate ? Math.round(rejection.rate * 100) : 0, tooltip: 'Relación de productos devueltos frente al total de productos tomados. Un valor alto sugiere problemas de precio, empaque o fecha de caducidad.' })}
      ${metricCard({ id: mid('dwell-time'), title: 'Permanencia Media', value: formatDwellTime(d.average_dwell_time_s), subtext: 'avg dwell', badge: 'Atención', tone: 'warning', highlight: true, barColor: '#B8790B', progressPercent: dwellProgress, tooltip: 'Tiempo promedio en segundos que las personas permanecieron frente al expositor durante su visita.' })}
    </div>
  </section>`;
}

function renderZonesSection(bundle = bundleDe(), idPrefix = '') {
  if (bundle.isLoadingMetrics) {
    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 space-y-3">
      <div class="h-4 skeleton rounded w-48"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="h-36 skeleton rounded-lg"></div>
        <div class="h-36 skeleton rounded-lg"></div>
      </div>
    </div>`;
  }
  if (bundle.errorMetrics) {
    return `
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <div class="p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 text-sm">
        <p class="font-semibold mb-1">Métricas de zona no disponibles</p>
        <p class="text-xs text-amber-800">${esc(bundle.errorMetrics)}</p>

  const zones = bundle.metrics;
  if (!zones || zones.length === 0) {
    return `

      ${icon('layers', 'w-8 h-8 text-slate-400 mx-auto mb-2')}

      <button type="button" data-action="zones-view-cards" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs rounded transition-colors ${viewMode === 'cards' ? 'bg-white text-[#111111] shadow-xs font-semibold border border-[#EAEAEA]' : 'text-[#787774] hover:text-[#111111]'}">

        </div>
        <p class="text-[11px] text-[#787774]">${isSingleZone ? 'Monitoreo centrado en góndola principal' : 'Desglose y conversión por estante o nivel de planograma'}</p>
      </div>
    </div>
    ${viewToggle}
  </div>`;

  let body;
  if (viewMode === 'table') {
    const rows = zones.map((z) => {

        </td>
        <td class="px-4 py-3.5 text-xs">${z.product_category ? `<span class="font-medium text-[#2F3437]">${esc(z.product_category)}</span>` : `<span class="italic text-[#A8A29E]">sin datos</span>`}</td>
        <td class="px-4 py-3.5 text-center font-semibold text-[#111111]">${formatNumber(z.people_count)}</td>
        <td class="px-4 py-3.5 text-center">
          ${intRate !== null
            ? `<div class="flex items-center justify-center gap-2">
                 <div class="w-12 bg-[#F3F2EF] h-1.5 rounded-full overflow-hidden"><div class="bg-[#1F6C9F] h-full" style="width:${Math.min(100, intRate)}%"></div></div>
                 <span class="text-[11px] font-mono text-[#44403C]">${formatPercentage(z.interaction_rate)}</span>
               </div>`
            : `<span class="text-[11px] italic text-[#A8A29E]">sin datos</span>`}

              <th class="px-4 py-3 font-semibold text-center">Tomas / Devol.</th>
              <th class="px-4 py-3 font-semibold text-center">Permanencia</th>
              <th class="px-5 py-3 font-semibold text-right">Conversión %</th>
            </tr>
          </thead>
          <tbody class="text-sm text-[#44403C] divide-y divide-[#F3F2EF]">${rows}</tbody>
        </table>
      </div>

  } else {
    const cards = zones.map((z) => {
      const rejection = calculateRejectionRate(z.put_back_count, z.pick_up_count);
      return `
      <div id="zone-card-${esc(idPrefix)}${esc(z.zone_id)}" class="bg-white rounded-xl border border-[#EAEAEA] p-4 shadow-xs card-lift flex flex-col justify-between">
        <div>

                <h3 class="text-sm font-bold text-[#111111]">${esc(z.name)}</h3>
              </div>
            </div>
            <div class="text-right">
              ${z.product_category
                ? `<span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded bg-[#F7F6F3] border border-[#EAEAEA] text-[#44403C]">${icon('tag', 'w-3 h-3 text-[#A8A29E]')} ${esc(z.product_category)}</span>`
                : `<span class="text-[11px] italic text-[#A8A29E]">Sin categoría</span>`}
            </div>
          </div>
          <div class="grid grid-cols-4 gap-2 py-2.5 my-2 border-y border-[#F3F2EF]">
            <div class="p-2 rounded-lg bg-[#F7F6F3] border border-[#F3F2EF]"><div class="text-[10px] font-semibold text-[#787774] uppercase tracking-wider">Tráfico</div><div class="text-base font-bold text-[#111111]">${formatNumber(z.people_count)}</div></div>
            <div class="p-2 rounded-lg bg-[#F7F6F3] border border-[#F3F2EF]"><div class="text-[10px] font-semibold text-[#787774] uppercase tracking-wider">Int.</div><div class="text-base font-bold text-[#111111]">${formatNumber(z.interaction_count)}</div></div>
            <div class="p-2 rounded-lg bg-[#F7F6F3] border border-[#F3F2EF]"><div class="text-[10px] font-semibold text-[#787774] uppercase tracking-wider">Tomas</div><div class="text-base font-bold text-[#2B5230]">${formatNumber(z.pick_up_count)}</div></div>
            <div class="p-2 rounded-lg bg-[#F7F6F3] border border-[#F3F2EF]"><div class="text-[10px] font-semibold text-[#787774] uppercase tracking-wider">Devol.</div><div class="text-base font-bold text-[#7F2523]">${formatNumber(z.put_back_count)}</div></div>
          </div>

            <div class="p-2 rounded-lg border border-[#F3F2EF] bg-[#F9F9F8]"><div class="text-[10px] text-[#787774] uppercase tracking-wider font-semibold">Toma / Int</div><div class="text-sm font-bold text-[#111111]">${formatPercentage(z.pick_up_rate)}</div></div>
            <div class="p-2 rounded-lg border border-[#F3F2EF] bg-[#F9F9F8]"><div class="text-[10px] text-[#787774] uppercase tracking-wider font-semibold">Conversión</div><div class="text-sm font-bold text-[#1F6C9F]">${formatPercentage(z.conversion_rate)}</div></div>
          </div>
        </div>
        <div class="mt-3 pt-2.5 border-t border-[#F3F2EF] flex flex-wrap items-center justify-between gap-2 text-xs text-[#787774]">
          <div class="flex items-center gap-1.5">${icon('clock', 'w-3 h-3 text-[#A8A29E]')}<span>Dwell: <strong class="text-[#111111]">${formatDwellTime(z.average_dwell_time_s)}</strong></span></div>

    body = `<div class="grid gap-3.5 ${isSingleZone ? 'grid-cols-1' : 'grid-cols-1 md:grid-cols-2'}">${cards}</div>`;
  }

  return `<section aria-labelledby="zones-heading" class="space-y-3">${header}${body}</section>`;
}

// Mapa de calor de góndolas y estantes: cruza zoneHierarchy (estructura)
// con zoneMetrics (numeros) por zone_id, y colorea cada estante segun su
// people_count relativo al mas concurrido de ESTE video. Debajo dibuja un
// ranking horizontal de todas las zonas ordenadas por interaccion, para
// comparar de un vistazo cual estante gana y por cuanto.
// Mapa de calor REAL: densidad espacial continua sobre las coordenadas
// (x, y) crudas de GET /videos/{id}/positions (pies de cada persona
// detectada, en pixeles del frame original), no un agregado coloreado por
// zona -eso es renderZonesHeatmap(), mas abajo-. El div que devuelve esta
// funcion es solo el marco; heatmap.js dibuja adentro en initPositionsHeatmap(),
// llamado despues de cada render() porque necesita el nodo ya en el DOM
// con su tamano final (heatmap.js no sabe pintar sobre un string HTML).
function renderPositionsHeatmap(bundle = bundleDe()) {
  const current = state.videos.find((v) => v.video_id === bundle.videoId);
  if (bundle.isLoadingPositions) {
    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs">
      <div class="h-4 skeleton rounded w-56 mb-3"></div>
      <div class="h-64 skeleton rounded-lg"></div>
    </div>`;
  }
  if (!current || !bundle.positions.length) {
    return `
    <div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] p-5 text-center text-xs text-[#787774]">
      Sin posiciones registradas todavía para este video.
    </div>`;
  }

  const aspect = current.width / current.height;
  return `
  <div class="rounded-xl border border-[#EAEAEA] p-5 shadow-xs" style="background:linear-gradient(165deg,#FFFFFF 0%,#EEF1F0 100%)">
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-[#F3F2EF] text-[#787774] flex items-center justify-center shrink-0">${icon('compass', 'w-4 h-4')}</div>
        <div>
          <h3 class="text-sm font-bold text-[#111111]">Mapa de Calor Real (por coordenadas)</h3>
          <p class="text-[11px] text-[#787774]">Densidad de ${formatNumber(bundle.positions.length)} posiciones detectadas, en píxeles del frame original</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 text-[10px] text-[#787774] shrink-0">
        <span>Menos</span><div class="w-24 h-2 rounded" style="background:linear-gradient(90deg,#0B1220,#1F6C9F,#5AD1E0,#FFF06B,#E0472C)"></div><span>Más</span>
      </div>
    </div>
    <div class="relative mt-3 mx-auto" style="max-width:640px">
      <div id="${bundle.heatmapId}" data-frame-width="${current.width}" data-frame-height="${current.height}"
           class="relative w-full rounded-lg border border-[#EAEAEA] bg-[#0B1220] overflow-hidden"
           style="aspect-ratio:${aspect}">
      </div>
      <div class="flex justify-between text-[10px] font-mono text-[#A8A29E] mt-1 px-0.5">
        <span>x=0</span><span>x=${formatNumber(current.width)}px</span>
      </div>
    </div>
    <p class="text-[10px] text-[#A8A29E] text-center mt-1">Eje Y: 0px (arriba) a ${formatNumber(current.height)}px (abajo) — origen en la esquina superior izquierda del frame</p>
  </div>`;
}

// Pinta heatmap.js dentro de #<containerId>. Se llama despues de cada
// render() (ver fillCountUps() mas abajo), nunca durante: heatmap.js
// necesita medir el contenedor ya insertado en el DOM (container.clientWidth)
// para saber a que escala de pixeles pintar. Recibe `positions` aparte (no
// state directamente) para poder pintar el mapa de CUALQUIER video -el
// principal o los de la comparacion-, cada uno en su propio contenedor.
function pintarHeatmap(containerId, positions) {
  const container = document.getElementById(containerId);
  if (!container || typeof h337 === 'undefined') return;
  const frameWidth = Number(container.dataset.frameWidth);
  const frameHeight = Number(container.dataset.frameHeight);
  if (!frameWidth || !frameHeight || !container.clientWidth) return;

  container.innerHTML = '';
  const heatmap = h337.create({
    container,
    radius: Math.max(16, Math.round(container.clientWidth * 0.035)),
    maxOpacity: 0.9,
    minOpacity: 0,
    blur: 0.85,
  });

  // heatmap.js pinta en pixeles de pantalla, no en pixeles del frame
  // original: hay que reescalar cada (x, y) a como se ve el contenedor
  // (que puede medir 640px de ancho para un frame de 1920px). Se agrupan
  // puntos que caen en el mismo pixel de pantalla (varios frames del mismo
  // track pasando por el mismo sitio) para que su "value" refleje
  // concentracion real, no un punto suelto por evento.
  const scaleX = container.clientWidth / frameWidth;
  const scaleY = container.clientHeight / frameHeight;
  const conteo = new Map();
  positions.forEach((p) => {
    const gx = Math.round(p.x * scaleX);
    const gy = Math.round(p.y * scaleY);
    const key = gx + ',' + gy;
    conteo.set(key, (conteo.get(key) || 0) + 1);
  });
  const data = Array.from(conteo, ([key, value]) => {
    const [x, y] = key.split(',').map(Number);
    return { x, y, value };
  });
  const max = Math.max(1, ...data.map((d) => d.value));
  heatmap.setData({ max, data });
}

function renderZonesHeatmap(bundle = bundleDe()) {
  const zones = bundle.hierarchy;
  if (bundle.isLoadingHierarchy) {
    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs">
      <div class="h-4 skeleton rounded w-48 mb-3"></div>
      <div class="h-40 skeleton rounded-lg"></div>
    </div>`;
  }
  if (!zones || zones.length === 0) {
    return `
    <div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] p-5 text-center text-xs text-[#787774]">
      Sin zonas configuradas todavía para este video.
    </div>`;
  }

  const metricsById = Object.fromEntries(bundle.metrics.map((m) => [m.zone_id, m]));
  const gondolas = zones.filter((z) => z.level === 'gondola');
  const shelvesByParent = {};
  zones.filter((z) => z.level === 'shelf').forEach((s) => {
    (shelvesByParent[s.parent_zone_id] ||= []).push(s);
  });

  const maxPeople = Math.max(1, ...zones.map((z) => (metricsById[z.zone_id] || {}).people_count || 0));
  const heatColor = (people) => {
    const t = Math.max(0, Math.min(1, people / maxPeople));
    const stops = t < 0.5
      ? [[214, 232, 245], [93, 155, 201], t / 0.5]
      : [[93, 155, 201], [11, 59, 92], (t - 0.5) / 0.5];
    const [a, b, local] = stops;
    const rgb = a.map((v, i) => Math.round(v + (b[i] - v) * local));
    return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  };

  const shelfRow = (s) => {
    const m = metricsById[s.zone_id] || {};
    return `
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 rounded px-3 py-2.5 mb-2 text-white text-xs" style="background:${heatColor(m.people_count || 0)}">
      <span class="font-semibold leading-snug">${esc(s.name)}</span>
      <span class="font-mono text-[11px] opacity-90 sm:ml-auto sm:text-right whitespace-nowrap">${formatNumber(m.people_count || 0)} pers · ${formatNumber(m.interaction_count || 0)} interac · ${formatDwellTime(m.average_dwell_time_s)}</span>
    </div>`;
  };

  const gondolaCard = (g) => {
    const m = metricsById[g.zone_id] || {};
    const shelves = shelvesByParent[g.zone_id] || [];
    const shelvesTotal = shelves.reduce((sum, s) => sum + ((metricsById[s.zone_id] || {}).people_count || 0), 0);
    const totalPeople = m.people_count || shelvesTotal;
    return `
    <div class="rounded-xl border border-[#EAEAEA] p-4 shadow-xs" style="background:linear-gradient(160deg,#FFFFFF 0%,#F3F2EF 100%)">
      <div class="flex items-baseline justify-between mb-3">
        <h4 class="text-sm font-bold text-[#111111]">${esc(g.name)}</h4>
        <span class="text-[11px] font-mono text-[#787774]">${formatNumber(totalPeople)} pers</span>
      </div>
      ${shelves.length ? shelves.map(shelfRow).join('') : `<div class="text-[11px] italic text-[#A8A29E]">Sin estantes configurados.</div>`}
    </div>`;
  };

  function renderRanking() {
    const compareList = zones.filter((z) => z.level === 'shelf').length
      ? zones.filter((z) => z.level === 'shelf')
      : zones;
    const withMetrics = compareList
      .map((z) => ({ ...z, m: metricsById[z.zone_id] || {} }))
      .sort((a, b) => (b.m.interaction_count || 0) - (a.m.interaction_count || 0));
    const maxInteraction = Math.max(1, ...withMetrics.map((z) => z.m.interaction_count || 0));

    const rows = withMetrics.map((z) => `
      <div class="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3">
        <span class="text-xs text-[#57534E] leading-snug sm:w-40 sm:shrink-0" title="${esc(z.name)}">${esc(z.name)}</span>
        <div class="flex-1 flex items-center gap-2">
          <div class="flex-1 bg-[#F3F2EF] h-3 rounded-full overflow-hidden">
            <div class="h-full rounded-full" style="width:${Math.max(4, Math.round((z.m.interaction_count || 0) / maxInteraction * 100))}%;background:#1F6C9F"></div>
          </div>
          <span class="text-xs font-mono text-[#111111] w-8 text-right shrink-0">${formatNumber(z.m.interaction_count || 0)}</span>
        </div>
      </div>`).join('');

    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs space-y-3">
      <div>
        <h3 class="text-sm font-bold text-[#111111]">Ranking de zonas por interacción</h3>
        <p class="text-[11px] text-[#787774]">Cuál estante genera más paradas de cliente, de mayor a menor</p>
      </div>
      <div class="space-y-2.5">${rows}</div>
    </div>`;
  }

  return `
  <div class="space-y-4">
    <div class="rounded-xl border border-[#EAEAEA] p-5 shadow-xs" style="background:linear-gradient(165deg,#FFFFFF 0%,#EEF1F0 100%)">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-[#F3F2EF] text-[#787774] flex items-center justify-center shrink-0">${icon('map', 'w-4 h-4')}</div>
          <div>
            <h3 class="text-sm font-bold text-[#111111]">Resumen por Zona</h3>
            <p class="text-[11px] text-[#787774]">Total agregado por góndola/estante — el mapa de calor por coordenadas está arriba</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 text-[10px] text-[#787774]">
          <span>Menos</span><div class="w-24 h-2 rounded" style="background:linear-gradient(90deg,#D6E8F5,#5D9BC9,#0B3B5C)"></div><span>Más</span>
        </div>
      </div>
      <div class="grid gap-3.5 grid-cols-1 md:grid-cols-2 mt-3">${gondolas.map(gondolaCard).join('')}</div>
    </div>
    ${renderRanking()}
  </div>`;
}

// Diagnostico automatico ("Space Management en 10 segundos"): reglas
// simples sobre los numeros ya calculados (nada de IA ni llamada extra a la
// API) que arman 2-4 tarjetas de texto con una lectura y una accion
// sugerida. Vive en la columna DERECHA del dashboard (ver render() mas
// abajo), debajo de "Privacidad y Ética".
function renderInsights() {
  if (!state.videoDetail) return '';
  const d = state.videoDetail;
  const zones = state.zoneMetrics;
  const engagementRatio = d.people_count > 0 ? d.interaction_count / d.people_count : 0;
  const hasPickUps = d.pick_up_count > 0;
  const rejectionRatio = hasPickUps ? d.put_back_count / d.pick_up_count : 0;
  const dwell = d.average_dwell_time_s || 0;

  const list = [];
  if (d.people_count === 0) {
    list.push({ type: 'neutral', title: 'Sin tránsito en el pasillo', desc: 'No se detectaron personas durante este periodo de grabación.', action: 'Evaluar iluminación de cabecera o señalética direccional de pasillo.' });
  } else if (engagementRatio >= 0.8) {
    list.push({ type: 'success', title: 'Alta atracción de clientes al expositor', desc: `Un promedio de ${engagementRatio.toFixed(1)} interacciones por transeúnte con permanencia media de ${formatDwellTime(dwell)}.`, action: 'Mantener la posición de categoría; los clientes se detienen con naturalidad frente a este espacio.' });
  } else if (engagementRatio < 0.4) {
    list.push({ type: 'attention', title: 'Tráfico de paso rápido (Baja detención)', desc: 'La mayoría de personas circulan frente a la góndola sin detenerse ni interactuar.', action: 'Considerar productos gancho o cartelería promocional a la altura de los ojos (1.40m - 1.60m) para frenar el paso.' });
  }
  if (hasPickUps) {
    if (rejectionRatio > 0.4) {
      list.push({ type: 'attention', title: `Fricción de compra: ${Math.round(rejectionRatio * 100)}% de tomas devueltas`, desc: `De ${d.pick_up_count} tomas registradas, ${d.put_back_count} fueron devueltas a la góndola sin compra.`, action: 'Verificar claridad de etiquetas de precio, empaques dañados o información nutricional confusa en los estantes.' });
    } else if (d.put_back_count === 0) {
      list.push({ type: 'success', title: 'Decisión directa: 0% devoluciones', desc: `Todas las ${d.pick_up_count} tomas de producto se mantuvieron en poder del cliente.`, action: 'Planograma óptimo: la presentación del producto genera convicción inmediata en el comprador.' });
    }
  } else if (d.interaction_count > 5 && d.pick_up_count === 0) {
    list.push({ type: 'attention', title: 'Interacción visual sin contacto físico', desc: 'Los clientes se detienen frente a la góndola pero no toman ningún artículo con las manos.', action: 'Revisar accesibilidad física del estante y visibilidad frontal del surtido.' });
  }
  if (zones.length > 1) {
    const bestZone = [...zones].sort((a, b) => (b.conversion_rate || 0) - (a.conversion_rate || 0))[0];
    if (bestZone && (bestZone.conversion_rate || 0) > 0) {
      list.push({ type: 'success', title: `Zona líder en conversión: ${bestZone.name}`, desc: `Registró la mayor tasa de conversión (${formatPercentage(bestZone.conversion_rate)}) entre los estantes analizados.`, action: `Aprovechar el nivel '${bestZone.level}' para productos de mayor margen comercial o lanzamientos.` });
    }
  }

  const cards = list.map((rec) => {
    const isSuccess = rec.type === 'success';
    const isAttention = rec.type === 'attention';
    const cls = isSuccess ? 'bg-[#EDF3EC]/60 border-[#C7D6C5] text-[#346538]' : isAttention ? 'bg-[#FBF3DB]/40 border-[#EDD9A3] text-[#956400]' : 'bg-[#F7F6F3] border-[#EAEAEA] text-[#2F3437]';
    const iconHtml = isSuccess ? icon('check-circle-2', 'w-3.5 h-3.5 text-[#2B5230] shrink-0') : isAttention ? icon('alert-circle', 'w-3.5 h-3.5 text-[#956400] shrink-0') : icon('lightbulb', 'w-3.5 h-3.5 text-[#787774] shrink-0');
    return `
    <div class="rounded-lg p-3 border flex flex-col justify-between ${cls}">
      <div>
        <div class="flex items-center gap-1.5 mb-1.5">${iconHtml}<h4 class="text-xs font-bold leading-tight text-[#111111]">${esc(rec.title)}</h4></div>
        <p class="text-[11px] text-[#57534E] leading-relaxed mb-2.5">${esc(rec.desc)}</p>
      </div>
      <div class="pt-2 border-t border-black/5 flex items-start gap-1.5 text-[11px]">
        ${icon('arrow-right', 'w-3 h-3 text-[#1F6C9F] shrink-0 mt-0.5')}
        <span class="text-[#44403C]"><strong class="text-[#111111]">Acción:</strong> ${esc(rec.action)}</span>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="bg-white rounded-xl border border-[#EAEAEA] p-4.5 shadow-xs space-y-3.5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#F3F2EF] pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-[#1F6C9F]/10 text-[#1F6C9F] flex items-center justify-center shrink-0">${icon('compass', 'w-4 h-4')}</div>
        <div>
          <h3 class="text-sm font-bold text-[#111111]">Diagnóstico de Space Management en 10 Segundos</h3>
          <p class="text-[11px] text-[#787774]">Síntesis ejecutiva de comportamiento para gerencia de tienda y planogramación</p>
        </div>
      </div>
      <div class="inline-flex items-center gap-1.5 text-[11px] text-[#787774] bg-[#F7F6F3] px-2.5 py-1 rounded-md border border-[#EAEAEA]">
        ${icon('trending-up', 'w-3.5 h-3.5 text-[#1F6C9F]')}<span>Telemetría de video anónima</span>
      </div>
    </div>
    <div class="grid grid-cols-1 gap-3">${cards}</div>
  </div>`;
}

function errorAlert({ title, detail, retryAction, showMock = true, isRetrying = false }) {

    <div class="flex items-start gap-3">
      <div class="p-2 rounded-lg bg-red-50 text-red-600 shrink-0">${icon('alert-circle', 'w-6 h-6')}</div>
      <div class="flex-1">
        <h3 class="text-base font-bold text-slate-900">${esc(title)}</h3>
        <div class="mt-1 p-3 rounded-lg bg-red-50/70 border border-red-100 font-mono text-xs text-red-900 leading-relaxed">${esc(detail)}</div>
        <p class="text-xs text-slate-500 mt-2">El backend FastAPI no devolvió los datos esperados o la conexión no pudo establecerse.</p>
      </div>

      <button type="button" data-action="${retryAction}" ${isRetrying ? 'disabled' : ''} class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-xs disabled:opacity-50 transition-colors">
        ${icon('refresh-cw', `w-3.5 h-3.5 ${isRetrying ? 'animate-spin' : ''}`)} Reintentar petición
      </button>
      ${showMock ? `<button type="button" data-action="enable-mock" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold transition-colors">${icon('database', 'w-3.5 h-3.5')} Explorar con Datos de Demostración del Contrato</button>` : ''}
      <button type="button" data-action="open-settings" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium transition-colors">${icon('sliders', 'w-3.5 h-3.5')} Configurar URL del Backend</button>
    </div>
  </div>`;
}

    <div class="p-3 rounded-lg border text-xs flex items-start gap-2 ${state.configTest.success ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}">
      ${state.configTest.success ? icon('check-circle-2', 'w-4 h-4 text-emerald-600 shrink-0 mt-0.5') : icon('alert-triangle', 'w-4 h-4 text-amber-600 shrink-0 mt-0.5')}
      <div class="leading-relaxed">${esc(state.configTest.message)}</div>
    </div>`;

  return `
  <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs modal-backdrop">
    <div class="bg-white rounded-2xl max-w-lg w-full border border-slate-200 shadow-xl overflow-hidden modal-anim">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-lg bg-slate-900 text-white">${icon('server', 'w-4 h-4')}</div>
          <div>
            <h2 class="text-sm font-bold text-slate-900">Configuración de la API REST (FastAPI)</h2>
            <p class="text-xs text-slate-500">Conexión exclusiva con el backend de Góndola Inteligente</p>
          </div>
        </div>
        <button type="button" data-action="close-settings" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200 transition-colors" aria-label="Cerrar ventana">${icon('x', 'w-4 h-4')}</button>
      </div>
      <div class="p-6 space-y-5">
        <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50 flex items-start justify-between gap-3">
          <div class="space-y-0.5">
            <div class="flex items-center gap-2">${icon('database', 'w-4 h-4 text-indigo-600')}<span class="text-xs font-bold text-slate-900">Modo Datos de Demostración (Contrato Oficial)</span></div>
            <p class="text-xs text-slate-500 leading-relaxed">Útil para explorar la interfaz sin requerir el backend FastAPI corriendo localmente. Replica con precisión los endpoints y esquemas requeridos.</p>
          </div>
          <button type="button" data-action="toggle-mock-in-modal" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${state.useMockMode ? 'bg-indigo-600' : 'bg-slate-300'}">
            <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out ${state.useMockMode ? 'translate-x-5' : 'translate-x-0'}"></span>

        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label for="api-base-url-input" class="text-xs font-semibold text-slate-700">Base URL de la API (Python FastAPI):</label>
            <button type="button" data-action="reset-default-url" class="text-[11px] text-indigo-600 hover:underline">Restablecer (127.0.0.1:8000)</button>
          </div>
          <div class="flex gap-2">
            <input id="api-base-url-input" type="text" value="${esc(state.apiBaseUrl)}" placeholder="http://127.0.0.1:8000"
                   class="flex-1 px-3 py-2 text-sm font-mono bg-white border border-slate-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <button type="button" data-action="test-connection" ${state.configTesting ? 'disabled' : ''} class="px-3 py-2 text-xs font-semibold rounded-lg border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 transition-colors inline-flex items-center gap-1.5 disabled:opacity-50">
              ${state.configTesting ? icon('refresh-cw', 'w-3.5 h-3.5 animate-spin text-slate-500') : icon('server', 'w-3.5 h-3.5 text-slate-500')} Probar
            </button>
          </div>
          <p class="text-[11px] text-slate-500">Valor por defecto: <code class="bg-slate-100 px-1 py-0.5 rounded text-slate-700">http://127.0.0.1:8000</code>. Se consulta el endpoint <code class="bg-slate-100 px-1 py-0.5 rounded text-slate-700">GET /health</code>.</p>
        </div>
        ${testResultHtml}
        <div class="pt-2 border-t border-slate-100">
          <h4 class="text-xs font-semibold text-slate-700 mb-1.5 flex items-center gap-1">${icon('help-circle', 'w-3.5 h-3.5 text-slate-400')} Endpoints de solo lectura consumidos:</h4>
          <div class="text-[11px] font-mono text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1">
            <div>GET /health</div><div>GET /videos</div><div>GET /videos/{video_id}</div><div>GET /videos/{video_id}/metrics</div><div>GET /videos/{video_id}/zones</div>
          </div>

      </div>
      <div class="px-6 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2">
        <button type="button" data-action="close-settings" class="px-3.5 py-2 text-xs font-medium text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-200/70 transition-colors">Cancelar</button>
        <button type="button" data-action="save-settings" class="px-4 py-2 text-xs font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-xs transition-colors">Guardar y Aplicar</button>
      </div>
    </div>
