[pytest]
# Se corre siempre asi, desde backend/:
#     cd backend && pytest
# No se mezcla con ai-service/tests: ese conjunto (los "241 tests en verde"
# de docs/team-guide.md) no necesita PostgreSQL, y estos tests si. Mantenerlos
# separados evita que quien solo toca el pipeline necesite levantar la base
# de datos para correr `pytest` en la raiz del repo.
testpaths = tests
